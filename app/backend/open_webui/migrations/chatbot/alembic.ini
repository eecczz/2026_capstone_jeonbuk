# chatbot_db 의 별도 alembic config.
#
# 사용 (open_webui/ 디렉터리에서):
#   alembic -c migrations/chatbot/alembic.ini upgrade head
#   alembic -c migrations/chatbot/alembic.ini stamp e7f8a9b0c1d2
#   alembic -c migrations/chatbot/alembic.ini revision --autogenerate -m "..."
#
# OWI (customui) 의 alembic 과 완전 독립. crawler 3 table 의 schema 만 추적.

[alembic]
script_location = migrations/chatbot

prepend_sys_path = ..

version_path_separator = os

# sqlalchemy.url 은 env.py 가 DATABASE_URL_CHATBOT (또는 customui 의 dbname 만 chatbot_db 로 swap) 으로 동적 설정.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
