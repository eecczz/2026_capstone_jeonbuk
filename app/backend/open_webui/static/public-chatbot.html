<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>전북도청 AI 안내원</title>
<!-- Three.js / three-vrm 의 bare specifier "three" 해소용 import map.
     GLTFLoader.js 와 three-vrm.module.js 가 내부에서 `import ... from 'three'` 하는데
     브라우저는 importmap 없이는 bare specifier 를 못 푼다. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --primary: #111111;
    --primary-dark: #000000;
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #111111;
    --muted: #888888;
    --border: #e8e8e8;
    --user-bubble: #111111;
    --bot-bubble: #f3f3f3;
    --source-bg: #f7f7f7;
    --orb: #111111;
    --danger: #ff3b30;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 720px;
    margin: 0 auto;
    background: var(--surface);
  }

  /* ── 헤더 ── 로고 좌측 정렬, 다른 버튼 없음 */
  header {
    padding: 14px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-shrink: 0;
  }
  header img { height: 22px; opacity: 0.9; }

  /* ── 음성 orb 영역 — 흑백, 큰 검은 원 ── */
  .voice-stage {
    flex: 1 1 auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .orb-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    user-select: none;
  }

  /* ─────────── Visual toggle (Orb ↔ Character) ─────────── */
  .visual-toggle {
    display: inline-flex;
    gap: 4px;
    background: rgba(0, 0, 0, 0.04);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 14px;
  }
  .visual-toggle .vt-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #6b7280;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .visual-toggle .vt-btn:hover { color: #374151; }
  .visual-toggle .vt-btn.vt-active {
    background: #fff;
    color: #0b3d6e;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    font-weight: 600;
  }
  body.mode-dark .visual-toggle {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.08);
  }
  body.mode-dark .visual-toggle .vt-btn.vt-active {
    background: #1f2937;
    color: #93c5fd;
  }

  /* ─────────── VRM wrap (캐릭터 모드) ─────────── */
  .vrm-wrap {
    position: relative;
    width: 280px;
    height: 360px;
    user-select: none;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(180deg, #f5f7fa 0%, #e8edf5 100%);
  }
  body.mode-dark .vrm-wrap {
    background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
  }
  .vrm-wrap canvas { display: block; width: 100%; height: 100%; }
  .vrm-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #6b7280;
    text-align: center;
    pointer-events: none;
  }
  body.mode-dark .vrm-placeholder { color: #9ca3af; }
  .vrm-wrap.vrm-loaded .vrm-placeholder { display: none; }

  /* mode 토글 시 표시 분기 — 기본은 orb. body.visual-character 면 캐릭터 */
  body.visual-character .orb-wrap { display: none; }
  body:not(.visual-character) .vrm-wrap { display: none !important; }
  .orb {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a2a 0%, #111111 60%, #000000 100%);
    box-shadow: 0 10px 32px rgba(0,0,0,0.25);
    animation: orb-breathe 4s ease-in-out infinite;
    transition: transform 0.3s ease, background 0.3s ease;
    overflow: hidden;
  }
  .orb-yinyang, .orb-bars { display: none; }
  @keyframes orb-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }
  .orb-wrap.listening .orb { animation: orb-listen 1.1s ease-in-out infinite; }
  @keyframes orb-listen {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }

  /* ── thinking (응답 생성 중): yin-yang 회전 ── */
  .orb-wrap.thinking .orb {
    background: radial-gradient(circle at 50% 50%, #d8d8d8 0%, #bcbcbc 65%, #a0a0a0 100%);
    animation: yin-spin 2.6s linear infinite;
    box-shadow: 0 10px 32px rgba(0,0,0,0.18);
  }
  .orb-wrap.thinking .orb-yinyang {
    display: block;
    position: absolute;
    inset: 0;
  }
  .orb-wrap.thinking .orb-yinyang .yin,
  .orb-wrap.thinking .orb-yinyang .yang {
    position: absolute;
    width: 50%;
    height: 50%;
    border-radius: 50%;
  }
  /* 위쪽 흰 원 (살짝 오른쪽) — yin-yang 의 흰 반쪽 */
  .orb-wrap.thinking .orb-yinyang .yin {
    top: 6%;
    left: 38%;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.10);
  }
  /* 아래쪽 검은 원 (살짝 왼쪽) — yin-yang 의 검은 반쪽 */
  .orb-wrap.thinking .orb-yinyang .yang {
    bottom: 6%;
    left: 12%;
    background: #000000;
  }
  @keyframes yin-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── speaking (응답 중): 4 막대 파형 ── */
  .orb-wrap.speaking .orb {
    background: transparent;
    box-shadow: none;
    animation: none;
  }
  .orb-wrap.speaking .orb-bars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 100%;
  }
  .orb-wrap.speaking .orb-bars span {
    width: 32px;
    height: 70px;
    border-radius: 22px;
    background: #000000;
    animation: speak-bar 0.55s ease-in-out infinite;
    transform-origin: center;
  }
  .orb-wrap.speaking .orb-bars span:nth-child(1) { animation-delay: 0.00s; }
  .orb-wrap.speaking .orb-bars span:nth-child(2) { animation-delay: 0.12s; }
  .orb-wrap.speaking .orb-bars span:nth-child(3) { animation-delay: 0.24s; }
  .orb-wrap.speaking .orb-bars span:nth-child(4) { animation-delay: 0.36s; }
  @keyframes speak-bar {
    0%, 100% { height: 70px; }
    50%      { height: 130px; }
  }

  .voice-state {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    min-height: 18px;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .voice-hint { display: none; }

  /* 음성 모드 비활성화 (X) 버튼 — 우하단 빨강 원 */
  .voice-close-btn {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    border: 0;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(255,59,48,0.3);
    z-index: 10;
  }
  .voice-close-btn:hover { transform: scale(1.05); }
  .voice-close-btn svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 2.5; fill: none; }
  body.mode-voice .voice-close-btn { display: flex; }

  /* ── 채팅 히스토리 (orb 아래 작게) ── */
  .chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--border);
    background: #fafbfd;
    min-height: 100px;
  }
  .msg { display: flex; max-width: 92%; animation: in 0.2s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; justify-content: flex-end; }
  .msg.bot  { align-self: flex-start; }
  .bubble {
    padding: 8px 12px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .sources {
    margin-top: 4px;
    background: var(--source-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .sources .src-title { font-weight: 600; margin-bottom: 3px; color: var(--text); }
  .sources a { color: var(--text); text-decoration: underline; }
  .empty-hint {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 14px 8px;
  }

  /* ── 입력바 ── */
  .input-bar {
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: #f3f3f3;
    border-radius: 22px;
    padding: 6px 6px 6px 16px;
  }
  .input-row textarea {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 0;
    font-size: 14px;
    resize: none;
    max-height: 100px;
    min-height: 28px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  .icon-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: rgba(0,0,0,0.06); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.send {
    background: var(--primary);
    color: #fff;
  }
  .icon-btn.send:hover { background: var(--primary-dark); }
  .icon-btn.send:disabled { background: #cccccc; cursor: not-allowed; }
  .icon-btn.send svg { stroke: #fff; }

  /* 좁은 화면에서 */
  @media (max-width: 480px) {
    .orb-wrap { width: 180px; height: 180px; }
  }

  /* 텍스트 모드 = 기본: orb 영역 + 자막 숨김, 대화창/입력바 표시 */
  body.mode-text .voice-stage { display: none; }
  body.mode-text .voice-caption { display: none; }

  /* 음성 모드 = orb + 자막만, 헤더 일부와 채팅창/입력바 숨김 */
  body.mode-voice .chat { display: none; }
  body.mode-voice .input-bar { display: none; }

  /* 음성 모드 자막 (사용자 발화 + 봇 응답 1세트) */
  .voice-caption {
    width: min(560px, 92%);
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 96px;
  }
  .vc-bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.45;
    max-width: 92%;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .vc-bubble.visible { opacity: 1; transform: none; }
  .vc-user {
    background: var(--user-bubble);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .vc-bot {
    background: var(--bot-bubble);
    color: var(--text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
</style>
</head>
<body class="mode-text">
<div class="app">
  <header>
    <img src="/static/jblogo.png" alt="전북특별자치도" onerror="this.style.display='none'" />
  </header>

  <div class="voice-stage">
    <!-- 표시 모드 토글 — Orb ↔ Character. localStorage(jb_voice_visual) 에 저장. -->
    <div class="visual-toggle" id="visualToggle" aria-label="시각 모드 전환">
      <button type="button" class="vt-btn vt-active" data-mode="orb" title="오브 모드">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="8"/></svg>
        오브
      </button>
      <button type="button" class="vt-btn" data-mode="character" title="캐릭터 모드">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3.5-7 7-7s7 3 7 7"/></svg>
        캐릭터
      </button>
    </div>

    <div class="orb-wrap" id="orb" role="button" aria-label="음성 입력 시작/중지" tabindex="0">
      <div class="orb">
        <!-- thinking 상태: yin-yang 회전 -->
        <div class="orb-yinyang">
          <span class="yin"></span>
          <span class="yang"></span>
        </div>
        <!-- speaking 상태: 4 막대 파형 -->
        <div class="orb-bars">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- 캐릭터 모드 — Three.js + three-vrm scene. 모델 파일 /static/character.vrm 필요. -->
    <div class="vrm-wrap" id="vrmWrap" role="button" aria-label="음성 입력 시작/중지" tabindex="0" style="display:none">
      <canvas id="vrmCanvas" width="280" height="360"></canvas>
      <div class="vrm-placeholder" id="vrmPlaceholder">
        <svg viewBox="0 0 24 24" width="48" height="48" style="opacity:.35">
          <circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3.5-7 7-7s7 3 7 7"/>
        </svg>
        <div style="margin-top:12px;font-size:13px;opacity:.6">캐릭터 모델 로드 중…</div>
        <div style="margin-top:4px;font-size:11px;opacity:.4">/static/character.vrm</div>
      </div>
    </div>

    <div class="voice-state" id="voiceState"></div>
    <div class="voice-hint" id="voiceHint"></div>
    <div class="voice-caption" id="voiceCaption">
      <div class="vc-bubble vc-user" id="vcUser"></div>
      <div class="vc-bubble vc-bot" id="vcBot"></div>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="empty-hint" id="emptyHint"></div>
  </div>

  <div class="input-bar">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="질문을 입력하세요"></textarea>
      <button class="icon-btn" id="voiceBtn" type="button" title="음성으로 질문" aria-label="음성 모드">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </button>
      <button class="icon-btn send" id="sendBtn" type="button" title="전송" aria-label="전송">
        <svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
      </button>
    </div>
  </div>

  <button class="voice-close-btn" id="voiceCloseBtn" type="button" title="음성 모드 종료" aria-label="음성 모드 종료">
    <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>
</div>

<script>
  const API_BASE = "/api/v1/public";
  const STORAGE_KEY = "jb_public_chat_history";

  // ─────────── DOM ───────────
  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const orbEl = document.getElementById("orb");
  const stateEl = document.getElementById("voiceState");
  const hintEl = document.getElementById("voiceHint");
  const emptyHint = document.getElementById("emptyHint");
  const voiceBtn = document.getElementById("voiceBtn");
  const voiceCloseBtn = document.getElementById("voiceCloseBtn");
  const vcUserEl = document.getElementById("vcUser");
  const vcBotEl = document.getElementById("vcBot");

  // ─────────── UI 모드 (text / voice) ───────────
  // 첫 진입은 텍스트 모드. 헤더 토글 버튼으로 음성 모드 진입.
  // 음성 모드에서는 chat / input bar 가 숨겨지고 orb + 자막(1세트)만 표시.
  let uiMode = "text";

  function setVoiceCaption(userText, botText) {
    if (typeof userText === "string") {
      vcUserEl.textContent = userText;
      vcUserEl.classList.toggle("visible", !!userText.trim());
    }
    if (typeof botText === "string") {
      vcBotEl.textContent = botText;
      vcBotEl.classList.toggle("visible", !!botText.trim());
    }
  }
  function clearVoiceCaption() {
    vcUserEl.textContent = "";
    vcBotEl.textContent = "";
    vcUserEl.classList.remove("visible");
    vcBotEl.classList.remove("visible");
  }

  // ─────────── Pipecat WebSocket 음성 클라이언트 ───────────
  // 음성 모드 진입 시: WS 연결 → 마이크 PCM 16kHz 16-bit LE mono 양방향 스트리밍.
  // 백엔드 Pipecat 파이프라인이 VAD/turn-taking/STT/RAG/TTS 를 처리하고 음성을
  // 같은 WS 로 돌려보낸다. 자막은 별도 텍스트 메시지로 푸시될 때 갱신.
  // (현 단계는 raw PCM 양방향만 — 텍스트 자막 메시지는 백엔드 추가 작업 후 활성화)
  let pcWs = null;
  let pcAudioCtx = null;
  let pcMicStream = null;
  let pcMicSource = null;
  let pcProcessor = null;
  let pcPlaybackTime = 0;
  let pcPlaybackSources = [];
  let pcAcceptAudio = false;
  let pcReplyAudioChunks = 0;
  let pcDroppedAudioChunks = 0;
  let pcPausedByUser = false;
  // phase_overlay (사용자 발화 요약 잠깐 끼어들기) 잠금 — 3.5s 동안 stateEl 점유.
  let phaseOverlayUntil = 0;
  let phaseOverlayPending = null;
  let phaseOverlayTimer = null;
  // 입력: 마이크 16kHz (Cohere STT 호환). 출력: TTS endpoint 응답 24kHz (Qwen3-TTS).
  const PC_SAMPLE_RATE = 16000;
  const PC_TTS_SAMPLE_RATE = 24000;

  // (롤백) 봇 답변 중 마이크 mute 는 끼어들기 자유도를 해쳐 사용자가 비활성화 요청.
  // Pipecat 의 allow_interruptions=True 만으로 끼어들기 처리.

  function _f32ToI16LE(f32) {
    const out = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  function _enqueuePlayback(arrayBuf) {
    if (!pcAudioCtx) return;
    // 텍스트 모드면 backend 가 보낸 audio frame 무시 (voice → text 토글 후 잔여
    // frame 들이 들어와 재생되는 케이스 차단).
    if (typeof uiMode !== "undefined" && uiMode !== "voice") return;
    if (!pcAcceptAudio) {
      pcDroppedAudioChunks += 1;
      return;
    }
    const i16 = new Int16Array(arrayBuf);
    if (!i16.length) return;
    pcReplyAudioChunks += 1;
    // 첫 audio chunk 도착 → speaking 모드 (4-bar 파형). 단계 라벨 비움.
    if (pcReplyAudioChunks === 1 && typeof setMode === "function") {
      setMode("speaking", "", "");
    }
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    const buf = pcAudioCtx.createBuffer(1, f32.length, PC_TTS_SAMPLE_RATE);
    buf.getChannelData(0).set(f32);
    const src = pcAudioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(pcAudioCtx.destination);
    const now = pcAudioCtx.currentTime;
    if (pcPlaybackTime < now + 0.05) pcPlaybackTime = now + 0.05;
    src.start(pcPlaybackTime);
    pcPlaybackTime += buf.duration;
    pcPlaybackSources.push(src);
    src.onended = () => {
      pcPlaybackSources = pcPlaybackSources.filter(s => s !== src);
      // 모든 audio source 재생 완료 시 listening 으로 복귀 (orb 디폴트 검은 원).
      if (pcPlaybackSources.length === 0 && uiMode === "voice") {
        if (typeof setMode === "function") setMode("listening", "", "");
      }
    };
  }

  function _clearPipecatPlayback() {
    for (const src of pcPlaybackSources) {
      try { src.stop(); } catch (_) {}
      try { src.disconnect(); } catch (_) {}
    }
    pcPlaybackSources = [];
    pcReplyAudioChunks = 0;
    if (pcAudioCtx) pcPlaybackTime = pcAudioCtx.currentTime + 0.05;
    else pcPlaybackTime = 0;
  }

  async function startVoicePipecat() {
    if (pcWs) return; // 이미 진행 중
    pcAcceptAudio = false;
    _clearPipecatPlayback();
    if (typeof setMode === "function") setMode("listening", "", "");

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const wsUrl = `${proto}://${location.host}${API_BASE}/voice-ws`;
    try {
      pcWs = new WebSocket(wsUrl);
      pcWs.binaryType = "arraybuffer";
    } catch (e) {
      if (typeof setMode === "function") setMode("idle", "연결 오류", "잠시 후 다시 시도해 주세요");
      pcWs = null;
      return;
    }

    pcWs.addEventListener("message", (ev) => {
      if (typeof ev.data === "string") {
        // 자막용 텍스트 메시지 (백엔드가 push 하기 시작하면 채움)
        try {
          const msg = JSON.parse(ev.data);
          if (msg && msg.type === "transcription") {
            pcAcceptAudio = false;
            pcDroppedAudioChunks = 0;
            setVoiceCaption(msg.text || "", null);
            // STT 도착 시점도 안전망으로 thinking 유지 (vad stop 이 먼저 와도 OK)
            if (typeof setMode === "function") setMode("thinking", "", "");
          }
          else if (msg && msg.type === "vad") {
            if (msg.text === "start") {
              // 이미 thinking 이면 그대로 — 멀티턴 발화 중 짧은 멈춤마다 VAD
              // start 가 다시 들어와 listening 으로 덮어 yin-yang 안 보이던 버그.
              // 응답 생성 중 (thinking) 에는 vad start 무시. listening/idle/
              // recording/speaking 상태일 때만 listening 으로 복귀.
              if (mode !== "thinking" && typeof setMode === "function") {
                setMode("listening", "", "");
              }
            } else if (msg.text === "stop") {
              if (typeof setMode === "function") setMode("thinking", "", "");
            }
          }
          else if (msg && msg.type === "phase_label") {
            console.log("[voice] phase_label:", msg.text);
            const text = msg.text || "";
            // overlay 잠금 중이면 마지막 phase 로만 기억, 잠금 끝나면 그게 적용
            if (Date.now() < phaseOverlayUntil) {
              phaseOverlayPending = text;
            } else if (stateEl) {
              stateEl.textContent = text;
            }
          }
          else if (msg && msg.type === "phase_overlay") {
            // 잠깐 끼어드는 라벨 (예: 발화 요약). 3.5s 동안 stateEl 점유 →
            // 그 후 마지막에 도착한 phase_label 로 자동 복귀.
            console.log("[voice] phase_overlay:", msg.text);
            if (stateEl) stateEl.textContent = msg.text || "";
            phaseOverlayUntil = Date.now() + 3500;
            phaseOverlayPending = null;
            clearTimeout(phaseOverlayTimer);
            phaseOverlayTimer = setTimeout(() => {
              phaseOverlayUntil = 0;
              if (stateEl && phaseOverlayPending !== null) {
                stateEl.textContent = phaseOverlayPending;
              }
              phaseOverlayPending = null;
            }, 3500);
          }
          else if (msg && msg.type === "reply") {
            pcAcceptAudio = true;
            pcReplyAudioChunks = 0;
            pcDroppedAudioChunks = 0;
            setVoiceCaption(null, msg.text || "");
            // 음성 대화 기록을 텍스트 모드 chat 영역 + localStorage 에 누적.
            // vcUserEl 의 텍스트는 마지막 transcription (멀티턴 합치기 마지막 chunk)
            // 으로 그 시점 사용자 발화 비슷 — 완전 정확은 아니지만 가독성 충분.
            const lastUserText = (vcUserEl.textContent || "").trim();
            if (lastUserText) {
              appendBubble("user", lastUserText);
              history.push({ role: "user", content: lastUserText });
            }
            if (msg.text) {
              appendBubble("bot", msg.text);
              history.push({ role: "assistant", content: msg.text });
            }
            if (typeof saveHistory === "function") saveHistory();
            scrollBottom();
          }
          else if (msg && msg.type === "clear") {
            pcAcceptAudio = false;
            _clearPipecatPlayback();
            setVoiceCaption(null, "");
            if (typeof setMode === "function") setMode("listening", "", "");
          }
        } catch (_) {}
      } else if (ev.data instanceof ArrayBuffer) {
        _enqueuePlayback(ev.data);
      }
    });
    pcWs.addEventListener("close", () => {
      stopVoicePipecat();
    });
    pcWs.addEventListener("error", () => {
      if (typeof setMode === "function") setMode("idle", "연결 끊김", "음성 모드 다시 시작해 주세요");
    });

    // 마이크 캡처 — 16kHz mono
    try {
      pcAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: PC_SAMPLE_RATE });
      pcMicStream = await navigator.mediaDevices.getUserMedia({
        audio: { sampleRate: PC_SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      pcMicSource = pcAudioCtx.createMediaStreamSource(pcMicStream);
      // ScriptProcessorNode (deprecated 지만 호환성·구현 단순)
      pcProcessor = pcAudioCtx.createScriptProcessor(2048, 1, 1);
      pcProcessor.onaudioprocess = (ev) => {
        if (pcPausedByUser) return;
        if (!pcWs || pcWs.readyState !== WebSocket.OPEN) return;
        const f32 = ev.inputBuffer.getChannelData(0);
        const i16 = _f32ToI16LE(f32);
        try { pcWs.send(i16.buffer); } catch (_) {}
      };
      pcMicSource.connect(pcProcessor);
      pcProcessor.connect(pcAudioCtx.destination); // ScriptProcessor 동작 위해 destination 연결 필수
      if (typeof setMode === "function") setMode("listening", "듣고 있어요", "한국어로 자연스럽게 말씀해 주세요");
    } catch (e) {
      if (typeof setMode === "function") setMode("idle", "마이크 권한 거부", "브라우저 설정에서 마이크 권한 허용 후 다시 시도");
      stopVoicePipecat();
    }
  }

  function stopVoicePipecat() {
    pcPausedByUser = false;
    if (pcProcessor) { try { pcProcessor.disconnect(); } catch (_) {} pcProcessor = null; }
    if (pcMicSource) { try { pcMicSource.disconnect(); } catch (_) {} pcMicSource = null; }
    if (pcMicStream) {
      try { pcMicStream.getTracks().forEach(t => t.stop()); } catch (_) {}
      pcMicStream = null;
    }
    if (pcAudioCtx) { try { pcAudioCtx.close(); } catch (_) {} pcAudioCtx = null; }
    _clearPipecatPlayback();
    pcAcceptAudio = false;
    if (pcWs) {
      try { pcWs.close(); } catch (_) {}
      pcWs = null;
    }
    pcPlaybackTime = 0;
  }

  function setUiMode(mode) {
    const prev = uiMode;
    uiMode = mode === "voice" ? "voice" : "text";
    document.body.classList.toggle("mode-voice", uiMode === "voice");
    document.body.classList.toggle("mode-text", uiMode === "text");
    if (uiMode === "voice") {
      clearVoiceCaption();
      if (typeof stopMicLoop === "function") stopMicLoop();
      startVoicePipecat();
    } else {
      // 음성 모드 → 텍스트 모드 전환: 모든 음성 활동 완전 정지
      stopVoicePipecat();
      if (typeof stopMicLoop === "function") stopMicLoop();
      if (typeof stopMediaRecorderFully === "function") stopMediaRecorderFully();
      if (typeof stopAllAudio === "function") stopAllAudio();
      if (typeof stopReply === "function") stopReply();
      if (typeof micStream !== "undefined" && micStream) {
        try { micStream.getTracks().forEach(t => t.stop()); } catch (_) {}
      }
      pausedByUser = true;
      if (typeof setMode === "function") setMode("idle", "", "");
    }
  }

  // ─────────── 상태 ───────────
  let history = [];
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) history = JSON.parse(saved);
  } catch (e) { history = []; }

  // ─────────── Visual mode toggle (Orb ↔ Character) ───────────
  // localStorage 에 저장. 기본 = orb. 캐릭터 모드는 VRM scene 로딩 (Phase B+).
  const VISUAL_KEY = "jb_voice_visual";
  let visualMode = localStorage.getItem(VISUAL_KEY) || "orb"; // "orb" | "character"
  const vrmWrap = document.getElementById("vrmWrap");

  function applyVisualMode(triggeredByUserClick) {
    document.body.classList.toggle("visual-character", visualMode === "character");
    const btns = document.querySelectorAll(".visual-toggle .vt-btn");
    btns.forEach(b => b.classList.toggle("vt-active", b.dataset.mode === visualMode));
    // ⚠️ vrmLoadIfNeeded 는 페이지 로드 자동 호출 X — 사용자의 명시적 토글 클릭에서만.
    // 새로고침 시 자동 import 가 mic 권한 prompt 흐름과 충돌하는 보고가 있어 가드.
    if (triggeredByUserClick && visualMode === "character" && typeof window.vrmLoadIfNeeded === "function") {
      window.vrmLoadIfNeeded();
    }
  }
  document.querySelectorAll(".visual-toggle .vt-btn").forEach(b => {
    b.addEventListener("click", () => {
      visualMode = b.dataset.mode;
      localStorage.setItem(VISUAL_KEY, visualMode);
      applyVisualMode(true);  // 사용자 클릭 → vrm 로드 허용
    });
  });
  applyVisualMode(false);  // 페이지 로드 — UI 만 적용, vrm 자동 로드 X

  // VRM Adapter — Three.js + three-vrm 으로 character.vrm 로드 + 모션 제어.
  // Phase B: lazy-load Three.js / three-vrm (CDN) + idle 모션
  // Phase C: setMode 이벤트 → expression / lookAt 매핑
  // Phase D: TTS audio amplitude → mouth blendshape (lip sync)
  window.vrmAdapter = (function () {
    let vrm = null;
    let scene = null, camera = null, renderer = null;
    let lipSyncAnalyser = null, lipSyncData = null, lipSyncRAF = null, lipSyncFakeOn = false;
    let lastBlink = 0, lastEyeMove = 0, lastHead = 0;
    const eyeTarget = { x: 0, y: 0 };
    const headSway = { x: 0, y: 0 };
    let currentMode = "idle";
    let loaded = false, loading = false, loadAttempted = false;

    async function ensureLoaded() {
      if (loaded || loading) return loaded;
      loading = true;
      console.log("[VRM] ensureLoaded() 시작 — Three.js CDN import 시도");
      try {
        // 1) Three.js + three-vrm CDN import (ES module)
        const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
        console.log("[VRM] ✓ three.module.js 로드 완료");
        const { GLTFLoader } = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js");
        console.log("[VRM] ✓ GLTFLoader 로드 완료");
        const VRMLib = await import("https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.7/lib/three-vrm.module.js");
        console.log("[VRM] ✓ three-vrm 로드 완료");

        const canvas = document.getElementById("vrmCanvas");
        if (!canvas) { loading = false; return false; }

        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(canvas.width, canvas.height, false);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(28, canvas.width / canvas.height, 0.1, 20);
        camera.position.set(0, 1.35, 1.6);
        camera.lookAt(0, 1.35, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dir = new THREE.DirectionalLight(0xffffff, 0.8);
        dir.position.set(1, 2, 1);
        scene.add(dir);

        // 2) VRM 로드
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLib.VRMLoaderPlugin(parser));

        await new Promise((resolve) => {
          loader.load(
            "/static/character.vrm",
            (gltf) => {
              vrm = gltf.userData.vrm;
              VRMLib.VRMUtils.removeUnnecessaryVertices(gltf.scene);
              VRMLib.VRMUtils.removeUnnecessaryJoints(gltf.scene);
              vrm.scene.rotation.y = Math.PI;   // 카메라 쪽 정면 (VRM 0.x 보정)
              scene.add(vrm.scene);
              loaded = true;
              const ph = document.getElementById("vrmPlaceholder");
              if (ph) ph.style.display = "none";
              document.getElementById("vrmWrap")?.classList.add("vrm-loaded");
              console.log("[VRM] loaded");
              resolve();
            },
            undefined,
            (err) => {
              console.warn("[VRM] character.vrm 없음 — Three.js primitive 사람 형상 fallback 으로 표시:", err);
              // Fallback: VRM 없이도 시각화. 단순 사람 형상 (머리=구, 몸통=실린더, 팔/다리)
              const group = new THREE.Group();
              const skin = new THREE.MeshLambertMaterial({ color: 0xf2c9a0 });
              const cloth = new THREE.MeshLambertMaterial({ color: 0x1f3a8a }); // 정장 네이비
              // 머리
              const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 24), skin);
              head.position.set(0, 1.55, 0);
              group.add(head);
              // 몸통
              const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.20, 0.55, 16), cloth);
              body.position.set(0, 1.13, 0);
              group.add(body);
              // 팔
              for (const x of [-0.22, 0.22]) {
                const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.50, 12), cloth);
                arm.position.set(x, 1.13, 0);
                group.add(arm);
              }
              // 다리
              for (const x of [-0.08, 0.08]) {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.55, 12), new THREE.MeshLambertMaterial({ color: 0x111827 }));
                leg.position.set(x, 0.55, 0);
                group.add(leg);
              }
              scene.add(group);
              // primitive 용 가짜 vrm-shape — 표정/lookAt 안 됨, head 만 sway 가능
              vrm = {
                scene: group,
                update: () => {},
                expressionManager: null,
                lookAt: null,
                humanoid: {
                  getNormalizedBoneNode(name) { return name === "head" ? head : null; }
                },
                _isPrimitive: true,
              };
              loaded = true;
              const ph = document.getElementById("vrmPlaceholder");
              if (ph) ph.style.display = "none";
              document.getElementById("vrmWrap")?.classList.add("vrm-loaded");
              console.log("[VRM] primitive fallback ready");
              resolve();
            }
          );
        });

        if (!loaded) { loading = false; return false; }

        // 3) Animation loop
        const clock = new THREE.Clock();
        function animate() {
          const dt = clock.getDelta();
          const t = performance.now();

          if (vrm) {
            // Idle blink (2~5초 랜덤)
            if (t - lastBlink > 2000 + Math.random() * 3000) {
              if (vrm.expressionManager?.setValue) {
                vrm.expressionManager.setValue("blink", 1.0);
                setTimeout(() => vrm.expressionManager?.setValue("blink", 0.0), 130);
              }
              lastBlink = t;
            }
            // Idle eye lookAt (5~10초 — 캐릭터가 살아있다 느낌)
            if (t - lastEyeMove > 5000 + Math.random() * 5000) {
              eyeTarget.x = (Math.random() - 0.5) * 0.35;
              eyeTarget.y = (Math.random() - 0.5) * 0.18;
              lastEyeMove = t;
            }
            // Idle head sway (10~20초)
            if (t - lastHead > 10000 + Math.random() * 10000) {
              headSway.x = (Math.random() - 0.5) * 0.08;
              headSway.y = (Math.random() - 0.5) * 0.06;
              lastHead = t;
            }
            // head bone 살짝 적용 (humanoid bone 보간)
            const head = vrm.humanoid?.getNormalizedBoneNode("head");
            if (head) {
              head.rotation.x += (headSway.x - head.rotation.x) * 0.03;
              head.rotation.y += (headSway.y - head.rotation.y) * 0.03;
            }
            // lookAt 적용
            if (vrm.lookAt?.target) {
              vrm.lookAt.target.position.set(eyeTarget.x, 1.35 + eyeTarget.y, 1);
            } else if (vrm.humanoid?.getNormalizedBoneNode) {
              // VRM 1.0 lookAt target 없으면 raw bone rotation
              const lEye = vrm.humanoid.getNormalizedBoneNode("leftEye");
              const rEye = vrm.humanoid.getNormalizedBoneNode("rightEye");
              if (lEye) lEye.rotation.set(-eyeTarget.y * 0.3, eyeTarget.x * 0.5, 0);
              if (rEye) rEye.rotation.set(-eyeTarget.y * 0.3, eyeTarget.x * 0.5, 0);
            }
            // Lip sync — TTS amplitude 기반
            if (lipSyncAnalyser && lipSyncData) {
              lipSyncAnalyser.getByteFrequencyData(lipSyncData);
              let sum = 0;
              for (let i = 0; i < 32; i++) sum += lipSyncData[i];
              const amp = Math.min(1.0, (sum / 32 / 255) * 2.5);
              vrm.expressionManager?.setValue("aa", amp);
            }
            vrm.update(dt);
          }
          renderer.render(scene, camera);
          requestAnimationFrame(animate);
        }
        animate();
        loading = false;
        return true;
      } catch (err) {
        console.warn("[VRM] Three.js CDN import 실패 — SVG 캐릭터 fallback 으로 전환:", err);
        // 외부 CDN 차단 (도청망 SSL inspection 등) 시에도 무조건 캐릭터 보이게.
        // SVG 사람 형상 + CSS blink/sway 애니메이션. 진짜 3D 아님 = 시각 PoC.
        const ph = document.getElementById("vrmPlaceholder");
        const wrap = document.getElementById("vrmWrap");
        if (ph) {
          ph.style.display = "block";
          ph.innerHTML = `
            <svg id="svgCharacter" viewBox="0 0 200 360" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:100%;max-height:360px;">
              <defs>
                <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#2d4a8a"/>

              </defs>
              <g id="svgHead" style="transform-origin: 100px 80px;">
                <ellipse cx="100" cy="80" rx="32" ry="38" fill="#f2c9a0"/>
                <path d="M68 60 Q100 35 132 60 Q132 75 100 70 Q68 75 68 60 Z" fill="#3a2418"/>
                <ellipse id="eyeL" cx="88" cy="82" rx="3" ry="4" fill="#1a1a1a"/>
                <ellipse id="eyeR" cx="112" cy="82" rx="3" ry="4" fill="#1a1a1a"/>
                <path d="M93 100 Q100 103 107 100" stroke="#a0664a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              </g>
              <ellipse cx="100" cy="125" rx="20" ry="12" fill="#f2c9a0"/>
              <path d="M55 145 Q100 135 145 145 L155 230 Q100 245 45 230 Z" fill="url(#suit)"/>
              <rect x="92" y="148" width="16" height="40" fill="#ffffff"/>
              <path d="M93 150 L100 165 L107 150 L100 175 Z" fill="#dc2626"/>
              <ellipse cx="38" cy="190" rx="10" ry="48" fill="url(#suit)"/>
              <ellipse cx="162" cy="190" rx="10" ry="48" fill="url(#suit)"/>
              <ellipse cx="38" cy="240" rx="9" ry="8" fill="#f2c9a0"/>
              <ellipse cx="162" cy="240" rx="9" ry="8" fill="#f2c9a0"/>
              <rect x="78" y="245" width="18" height="80" fill="#111827"/>
              <rect x="104" y="245" width="18" height="80" fill="#111827"/>
            </svg>
            <style>
              @keyframes svgBlink {
                0%, 92%, 100% { transform: scaleY(1); }
                95%, 97% { transform: scaleY(0.1); }

              @keyframes svgHeadSway {
                0%, 100% { transform: rotate(0deg) translateY(0); }
                50% { transform: rotate(1deg) translateY(-1px); }
              }
              #eyeL, #eyeR { transform-origin: center; animation: svgBlink 4.5s ease-in-out infinite; transform-box: fill-box; }
              #svgHead { animation: svgHeadSway 8s ease-in-out infinite; transform-box: fill-box; transform-origin: 100px 80px; }
              .svg-listening #svgHead { animation-duration: 4s; }
              .svg-thinking #eyeL, .svg-thinking #eyeR { transform: translateX(2px); }

            </style>
          `;
        }
        if (wrap) wrap.classList.add("vrm-svg-loaded");
        // SVG 어댑터 — VRM 어댑터의 interface 호환 (onMode/onPhase/onBotStart/Stop)
        vrm = {
          _isSvg: true,
          scene: null,
          update: () => {},
          expressionManager: { setValue: () => {} },
          lookAt: null,
          humanoid: { getNormalizedBoneNode: () => null },
        };
        loaded = true;
        loading = false;
        console.log("[VRM] SVG fallback ready");
        return true;
      }
    }

    function setExpression(name, value) {
      if (!vrm?.expressionManager?.setValue) return;
      // 표정 reset 후 한 가지만
      ["happy", "sad", "angry", "relaxed", "surprised"].forEach((e) => {
        if (e !== name) vrm.expressionManager.setValue(e, 0);
      });
      vrm.expressionManager.setValue(name, value);
    }

    function applySvgMode(next) {
      const w = document.getElementById("vrmWrap");
      if (!w) return;
      ["svg-listening", "svg-thinking", "svg-speaking", "svg-idle"].forEach(c => w.classList.remove(c));
      w.classList.add("svg-" + (next || "idle"));
    }

    return {
      ensureLoaded,
      isLoaded() { return loaded; },
      onMode(next) {
        currentMode = next;
        if (vrm?._isSvg) { applySvgMode(next); return; }
        if (next === "listening") {
          // 끄덕 + 시선 사용자
          eyeTarget.x = 0;
          eyeTarget.y = -0.05;
          setExpression("relaxed", 0.3);
        } else if (next === "thinking") {
          // 살짝 옆 시선, 생각하는 표정
          eyeTarget.x = 0.18;
          eyeTarget.y = 0.05;
          setExpression("relaxed", 0.0);
        } else if (next === "speaking") {
          // 정면 시선, 밝은 표정
          eyeTarget.x = 0;
          eyeTarget.y = 0;
          setExpression("happy", 0.4);
        } else {
          setExpression("relaxed", 0.2);
        }
      },
      onPhaseLabel(text) {
        // 자막 변할 때 약간 끄덕
        headSway.x = 0.05;
        setTimeout(() => { headSway.x = 0; }, 400);
      },
      onBotStartSpeaking(audioEl) {
        // ⚠️ 이전 createMediaElementSource 방식 제거 — 봇 audio element 의 routing 을
        // 가로채면 mic stream 흐름까지 깨지는 부작용 관찰됨.
        // Phase D 의 안전한 lip sync 는 fake amplitude (시간 기반 사인파) + 본격
        // 분석은 server-side TTS phoneme 으로 별도 구현.
        if (!vrm) return;
        // 가짜 입 움직임 (3Hz 사인) — 봇 audio 와 무관, 부작용 0
        let phase = 0;
        function tick() {
          if (!lipSyncFakeOn) return;
          phase += 0.18;
          const amp = 0.3 + 0.35 * Math.max(0, Math.sin(phase * 3.0));
          vrm.expressionManager?.setValue("aa", amp);
          lipSyncRAF = requestAnimationFrame(tick);
        }
        lipSyncFakeOn = true;
        tick();
      },
      onBotStopSpeaking() {
        lipSyncFakeOn = false;
        if (lipSyncRAF) cancelAnimationFrame(lipSyncRAF);
        if (vrm) vrm.expressionManager?.setValue("aa", 0);
      },
    };
  })();

  window.vrmLoadIfNeeded = async function () {
    try {
      if (!window.vrmAdapter || typeof window.vrmAdapter.ensureLoaded !== "function") return;
      // 첫 진입 시 한 번만 — adapter 안에서 loaded/loading guard
      await window.vrmAdapter.ensureLoaded();
    } catch (e) {
      console.warn("[VRM] vrmLoadIfNeeded failed (외부 CDN 차단 가능):", e);
      const ph = document.getElementById("vrmPlaceholder");
      if (ph) ph.textContent = "캐릭터 모듈 로드 실패 (외부 CDN 차단 가능)";
    }
  };

  let mode = "idle"; // idle | listening | thinking | speaking
  function setMode(next, label, hint) {
    mode = next;
    orbEl.classList.toggle("listening", next === "listening");
    orbEl.classList.toggle("thinking",  next === "thinking");
    orbEl.classList.toggle("speaking",  next === "speaking");
    if (label !== undefined) stateEl.textContent = label;
    if (hint  !== undefined) hintEl.textContent  = hint;
    // 캐릭터 모드면 VRM adapter 에도 알림
    if (window.vrmAdapter) window.vrmAdapter.onMode(next);
  }
  setMode("idle", "탭하여 말하기", "한국어로 자연스럽게 질문해 주세요");

  // ─────────── 채팅 렌더 ───────────
  function clearEmptyHint() {
    if (emptyHint && emptyHint.parentNode) emptyHint.remove();
  }
  function renderHistory() {
    if (history.length > 0) clearEmptyHint();
    history.forEach(m => appendBubble(m.role === "assistant" ? "bot" : m.role, m.content, m.sources));
    scrollBottom();
  }
  function appendBubble(role, content, sources) {
    clearEmptyHint();
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = content;
    msg.appendChild(bubble);

    if (role === "bot" && Array.isArray(sources) && sources.length > 0) {
      const box = document.createElement("div");
      box.className = "sources";
      const title = document.createElement("div");
      title.className = "src-title";
      title.textContent = "📍 출처";
      box.appendChild(title);
      // backend 구조: { source: {id, name, type, legacy}, document: [...], metadata: [{...},...] }
      // metadata 는 chunk 별 리스트. URL 단위 dedup 후 최대 5개 표시.
      const seen = new Set();
      let shown = 0;
      sources.forEach(s => {
        const metas = Array.isArray(s.metadata) ? s.metadata : (s.metadata ? [s.metadata] : []);
        for (const m of metas) {
          if (shown >= 5) break;
          if (!m || typeof m !== "object") continue;
          const url = m.url || m.source || "";
          const dedupKey = url || (m.title || m.name || "");
          if (!dedupKey || seen.has(dedupKey)) continue;
          seen.add(dedupKey);
          shown++;
          const name = m.title || m.name || m.institution || (s.source && s.source.name) || "출처";
          const inst = m.institution || "";
          const phone = m.contact_phone || "";
          const row = document.createElement("div");
          row.innerHTML =
            `<strong>${escapeHtml(String(name))}</strong>` +
            (inst && inst !== name ? ` <span class="src-inst">${escapeHtml(String(inst))}</span>` : "") +
            (phone ? ` · ☎ ${escapeHtml(String(phone))}` : "") +
            (url ? ` · <a href="${escapeHtml(String(url))}" target="_blank" rel="noopener">바로가기</a>` : "");
          box.appendChild(row);
        }
      });
      if (shown > 0) msg.appendChild(box);
    }

    chatEl.appendChild(msg);
    scrollBottom();
  }
  function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }
  function saveHistory() {
    const trimmed = history.slice(-20);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed)); } catch (e) {}
  }

  // ─────────── TTS 출력 (audio_url 우선, fallback browser TTS) ───────────
  let currentAudio = null;
  let lastBotEndTime = 0;
  const COOLDOWN_AFTER_TTS_MS = 1500; // TTS 종료 후 마이크 재청취 대기 (echo 방지)

  function stopAllAudio() {
    if (currentAudio) { try { currentAudio.pause(); } catch(_){} currentAudio = null; }
    // 안전망: 혹시 외부 코드가 발화시켰을 수 있는 브라우저 내장 TTS 도 강제 정지
    if ("speechSynthesis" in window) { try { window.speechSynthesis.cancel(); } catch(_){} }
  }
  function playReply(audioUrl, _text) {
    // 정책: 답변 음성은 백엔드 Qwen3-TTS (audio_url) 만 사용.
    // 브라우저 내장 SpeechSynthesis 는 사용하지 않는다 (사람 목소리/도청 톤 통일).
    // audio_url 이 없으면 무음으로 텍스트만 표시.
    // 안전망: 텍스트 모드 (uiMode !== "voice") 에서는 어떤 경로로 호출되든 재생 안 함.
    if (typeof uiMode !== "undefined" && uiMode !== "voice") {
      stopAllAudio();
      return;
    }
    stopAllAudio();
    stopMediaRecorderFully();
    stopMicLoop();

    const onEnd = () => {
      lastBotEndTime = Date.now();
      // 음성 모드일 때만 자동 재청취 — 텍스트 모드는 cool-down 불필요
      if (uiMode === "voice") enterCooldownThenListen();
    };

    if (audioUrl) {
      setMode("speaking", "답변 중...", "Orb 를 탭하면 멈춰요");
      const a = new Audio(audioUrl);
      currentAudio = a;
      a.addEventListener("ended", onEnd);
      a.addEventListener("error", onEnd);
      a.play().catch(onEnd);
      return;
    }
    // audio_url 없음 = TTS 실패. 텍스트만 보이고 다음 단계로.
    onEnd();
  }

  // ─────────── 텍스트 전송 ───────────
  async function sendMessage(text) {
    if (!text || !text.trim()) return;
    text = text.trim();

    appendBubble("user", text);
    history.push({ role: "user", content: text });
    inputEl.value = "";
    inputEl.style.height = "auto";

    sendBtn.disabled = true;
    setMode("thinking", "생각 중...", "");

    try {
      const resp = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history.slice(0, -1) })
      });
      if (!resp.ok) throw new Error(await resp.text() || `HTTP ${resp.status}`);
      const data = await resp.json();
      const reply = data.reply || "(응답이 비어 있습니다)";
      const sources = data.sources || [];
      appendBubble("bot", reply, sources);
      history.push({ role: "assistant", content: reply, sources });
      saveHistory();
      // 텍스트 모드는 음성 답변 OFF — 사용자가 텍스트만 원할 때 TTS 재생 안 함.
      // 음성 모드는 별도 WebSocket 흐름으로 처리 (이 경로 안 탐).
    } catch (e) {
      appendBubble("bot", `오류가 발생했습니다: ${e.message}`);
    } finally {
      sendBtn.disabled = false;
    }
  }

  // ─────────── 음성 자동 모드 (continuous listening + VAD + PCM pre-roll) ───────────
  // 발화 시작 클리핑 방지: MediaRecorder/webm 대신 ScriptProcessorNode 로
  // raw Float32 PCM 샘플을 ring buffer 에 항상 적재. VAD 트리거 시 ring 의
  // 600ms pre-roll + 이후 모든 샘플을 합쳐서 WAV 인코딩 후 STT 에 전송.
  // WAV 헤더는 매 utterance 마다 새로 생성되므로 webm 같은 손상 위험 없음.
  let micStream = null;
  let micAudioCtx = null;
  let micAnalyser = null;
  let micBuf = null;
  let micRafId = 0;
  let pausedByUser = true;
  let speechStartedAt = 0;
  let recStartedAt = 0;
  let recLastSpeechAt = 0;

  // PCM 샘플 캡처
  let pcmScriptNode = null;
  let pcmSampleRate = 48000;
  let pcmRingBuffer = [];                 // [Float32Array, ...] — listening 중 ring
  let pcmRingTotalSamples = 0;
  let isCapturingSpeech = false;          // true 면 ring 안 자르고 발화 캡처
  const PREROLL_SECONDS = 0.6;            // 발화 시작 600ms 전 음성도 보존
  const PCM_BUFFER_SIZE = 4096;           // ScriptProcessor frame size

  const VAD_SPEECH_RMS = 0.020;
  const SPEECH_HOLD_MS = 100;
  const SILENCE_TAIL_MS = 900;
  const MAX_RECORD_MS = 15000;
  const DEBUG_VAD = true;

  // ─────────── PCM → WAV 인코딩 (16-bit mono) ───────────
  function _writeStr(view, off, s) {
    for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
  }
  function encodePcmToWav(float32Chunks, sampleRate) {
    let total = 0;
    for (const c of float32Chunks) total += c.length;
    const buffer = new ArrayBuffer(44 + total * 2);
    const view = new DataView(buffer);
    _writeStr(view, 0, "RIFF");
    view.setUint32(4, 36 + total * 2, true);
    _writeStr(view, 8, "WAVE");
    _writeStr(view, 12, "fmt ");
    view.setUint32(16, 16, true);                   // fmt chunk size
    view.setUint16(20, 1, true);                    // PCM format
    view.setUint16(22, 1, true);                    // mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);       // byte rate
    view.setUint16(32, 2, true);                    // block align
    view.setUint16(34, 16, true);                   // bits per sample
    _writeStr(view, 36, "data");
    view.setUint32(40, total * 2, true);
    let off = 44;
    for (const c of float32Chunks) {
      for (let i = 0; i < c.length; i++, off += 2) {
        const s = Math.max(-1, Math.min(1, c[i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
    }
    return new Blob([buffer], { type: "audio/wav" });
  }

  async function ensureMic() {
    if (micStream) return true;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        }
      });
      micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      try { if (micAudioCtx.state === "suspended") await micAudioCtx.resume(); } catch (_) {}
      pcmSampleRate = micAudioCtx.sampleRate || 48000;

      const src = micAudioCtx.createMediaStreamSource(micStream);
      micAnalyser = micAudioCtx.createAnalyser();
      micAnalyser.fftSize = 1024;
      micAnalyser.smoothingTimeConstant = 0.3;
      micBuf = new Float32Array(micAnalyser.fftSize);
      src.connect(micAnalyser);

      // PCM 캡처 ScriptProcessorNode — listening 동안 항상 ring buffer 적재
      pcmScriptNode = micAudioCtx.createScriptProcessor(PCM_BUFFER_SIZE, 1, 1);
      pcmScriptNode.onaudioprocess = (e) => {
        if (pausedByUser) return;
        // 다른 모드 (speaking/thinking) 에선 캡처 안 함
        if (mode !== "listening" && mode !== "recording") return;

        const inputData = e.inputBuffer.getChannelData(0);
        // copy (ScriptProcessor 는 buffer reuse 함)
        const copy = new Float32Array(inputData);
        pcmRingBuffer.push(copy);
        pcmRingTotalSamples += copy.length;

        // listening 중엔 ring 을 PREROLL_SECONDS 만큼만 유지 (오래된 샘플 drop)
        // recording 중엔 안 자름 (모두 보존)
        if (!isCapturingSpeech) {
          const ringMaxSamples = Math.floor(pcmSampleRate * PREROLL_SECONDS);
          while (pcmRingTotalSamples - pcmRingBuffer[0].length >= ringMaxSamples) {
            pcmRingTotalSamples -= pcmRingBuffer.shift().length;
          }
        }
      };
      src.connect(pcmScriptNode);
      pcmScriptNode.connect(micAudioCtx.destination);  // ScriptProcessor 는 destination 연결 필요
      console.log(`[VAD] mic ready, sampleRate=${pcmSampleRate}`);
      return true;
    } catch (e) {
      setMode("idle", "마이크 권한이 필요해요", "Orb 를 탭하여 권한을 허용해 주세요");
      return false;
    }
  }

  function getRMS() {
    micAnalyser.getFloatTimeDomainData(micBuf);
    let sum = 0;
    for (let i = 0; i < micBuf.length; i++) sum += micBuf[i] * micBuf[i];
    return Math.sqrt(sum / micBuf.length);
  }

  let _vadDebugLastLog = 0;
  function micTick() {
    micRafId = 0;
    if (pausedByUser || !micAnalyser) return;

    const now = Date.now();
    const rms = getRMS();
    const isSpeech = rms >= VAD_SPEECH_RMS;

    if (DEBUG_VAD && now - _vadDebugLastLog > 250) {
      _vadDebugLastLog = now;
      console.log(`[VAD] mode=${mode} rms=${rms.toFixed(4)} thr=${VAD_SPEECH_RMS} isSpeech=${isSpeech}`);
    }

    if (mode === "listening") {
      if (isSpeech) {
        if (!speechStartedAt) speechStartedAt = now;
        if (now - speechStartedAt >= SPEECH_HOLD_MS) {
          startRecording();
        }
      } else {
        speechStartedAt = 0;
      }
    } else if (mode === "recording") {
      if (isSpeech) recLastSpeechAt = now;
      const silenceTail = recLastSpeechAt ? (now - recLastSpeechAt) : 0;
      if (recLastSpeechAt && silenceTail >= SILENCE_TAIL_MS) {
        stopRecording();
      } else if (now - recStartedAt > MAX_RECORD_MS) {
        stopRecording();
      }
    }

    if (!pausedByUser) micRafId = requestAnimationFrame(micTick);
  }

  function startMicLoop() {
    if (micRafId || pausedByUser) return;
    // PipeCat WebSocket (voice-ws) 이 활성이면 별도 mic loop / voice-chat
    // POST 흐름 시작하지 않는다. 두 음성 path 동시 동작 → backend 부하 + 502.
    if (typeof pcWs !== "undefined" && pcWs) return;
    speechStartedAt = 0;
    micRafId = requestAnimationFrame(micTick);
  }
  function stopMicLoop() {
    if (micRafId) cancelAnimationFrame(micRafId);
    micRafId = 0;
  }
  function stopMediaRecorderFully() {
    // PCM 캡처 중단 + ring buffer 비움
    isCapturingSpeech = false;
    pcmRingBuffer = [];
    pcmRingTotalSamples = 0;
  }

  function startRecording() {
    if (isCapturingSpeech) return;
    // ring buffer 에 이미 600ms pre-roll 들어가 있는 상태
    isCapturingSpeech = true;
    recStartedAt = Date.now();
    recLastSpeechAt = recStartedAt;
    setMode("recording", "듣고 있어요", "잠시 멈추면 자동 전송돼요");
  }
  function stopRecording() {
    if (!isCapturingSpeech) return;
    isCapturingSpeech = false;

    // 모든 PCM 샘플을 WAV 로 인코딩 (pre-roll 600ms + 발화)
    const totalSamples = pcmRingTotalSamples;
    const minSamples = Math.floor(pcmSampleRate * 0.5);  // 0.5초 미만이면 무시
    if (totalSamples < minSamples) {
      pcmRingBuffer = [];
      pcmRingTotalSamples = 0;
      setMode("listening", "듣고 있어요", "조금 더 길게 말씀해 주세요");
      startMicLoop();
      return;
    }
    const wavBlob = encodePcmToWav(pcmRingBuffer, pcmSampleRate);
    pcmRingBuffer = [];
    pcmRingTotalSamples = 0;
    if (DEBUG_VAD) {
      console.log(`[VAD] WAV 생성 — ${(wavBlob.size/1024).toFixed(1)}KB, samples=${totalSamples}, ${(totalSamples/pcmSampleRate).toFixed(2)}s`);
    }
    setMode("thinking", "생각 중...", "");
    submitVoice(wavBlob);
  }

  async function submitVoice(blob) {
    // 안전망 1: 텍스트 모드면 /voice-chat 호출 자체를 막음.
    if (typeof uiMode !== "undefined" && uiMode !== "voice") {
      stopMicLoop();
      stopMediaRecorderFully();
      return;
    }
    // 안전망 2: PipeCat WebSocket (voice-ws) 이 살아 있으면 /voice-chat
    // POST 흐름을 절대 호출 안 함. 두 흐름 동시 동작 시 backend 부하 +
    // /voice-chat 응답 지연으로 nginx 502 발생 (외부 노이즈 연쇄 발화 케이스).
    if (typeof pcWs !== "undefined" && pcWs) {
      stopMicLoop();
      stopMediaRecorderFully();
      return;
    }
    sendBtn.disabled = true;
    try {
      const form = new FormData();
      // WAV 우선, fallback 으로 webm — blob.type 으로 분기
      const ext = blob.type.includes("wav") ? "wav" : "webm";
      form.append("file", blob, `voice.${ext}`);
      form.append("history_json", JSON.stringify(history));
      if (lastBotEndTime > 0) {
        form.append("seconds_since_bot", String((Date.now() - lastBotEndTime) / 1000));
      }
      const resp = await fetch(`${API_BASE}/voice-chat`, { method: "POST", body: form });
      if (!resp.ok) throw new Error(await resp.text() || `HTTP ${resp.status}`);
      const data = await resp.json();
      if (data.ignored) {
        setMode("listening", "듣고 있어요", "주변 소음으로 들렸어요. 다시 말씀해 주세요");
        startMicLoop();
        return;
      }
      if (data.needs_retry) {
        setMode("listening", "듣고 있어요", data.reply || "한국어로 다시 말씀해 주세요");
        startMicLoop();
        return;
      }
      const question = data.question || "(음성 인식 실패)";
      const reply = data.reply || "(응답이 비어 있습니다)";
      const sources = data.sources || [];

      appendBubble("user", question);
      history.push({ role: "user", content: question });
      appendBubble("bot", reply, sources);
      history.push({ role: "assistant", content: reply, sources });
      saveHistory();

      // 음성 모드: 1세트만 자막으로 표시 (직전 세트 덮어씀)
      if (uiMode === "voice") setVoiceCaption(question, reply);

      playReply(data.audio_url || null, reply);
    } catch (e) {
      appendBubble("bot", `음성 처리 오류: ${e.message}`);
      if (uiMode === "voice") setVoiceCaption(null, `음성 처리 오류: ${e.message}`);
      enterCooldownThenListen();
    } finally {
      sendBtn.disabled = false;
    }
  }

  // 봇 응답 (TTS) 끝난 후 cool-down 후 자동 listening 재개
  function enterCooldownThenListen() {
    setMode("idle", "잠시만요", "곧 다시 들을게요");
    setTimeout(() => {
      if (pausedByUser) {
        setMode("idle", "일시정지", "Orb 를 탭하여 다시 시작");
        return;
      }
      setMode("listening", "듣고 있어요", "한국어로 자연스럽게 말씀해 주세요");
      startMicLoop();
    }, COOLDOWN_AFTER_TTS_MS);
  }

  // ─────────── Orb 탭: pause/resume + speaking 중지 ───────────
  async function onOrbTap() {
    // 텍스트 모드면 Orb 탭으로 음성 listening 시작 안 함.
    if (typeof uiMode !== "undefined" && uiMode !== "voice") {
      return;
    }
    if (mode === "speaking") {
      stopAllAudio();
      enterCooldownThenListen();
      return;
    }
    if (mode === "thinking") return;

    if (mode === "recording") {
      // 사용자가 명시적으로 즉시 전송
      stopRecording();
      return;
    }

    if (pausedByUser || mode === "idle") {
      // 자동 모드 시작/재개
      if (!await ensureMic()) return;
      pausedByUser = false;
      setMode("listening", "듣고 있어요", "한국어로 자연스럽게 말씀해 주세요");
      startMicLoop();
    } else {
      // listening 중에 탭 = 일시정지
      pausedByUser = true;
      stopMicLoop();
      stopMediaRecorderFully();
      setMode("idle", "일시정지", "Orb 를 탭하여 다시 시작");
    }
  }

  orbEl.addEventListener("click", onOrbTap);
  orbEl.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); onOrbTap(); }
  });
  // 캐릭터 모드도 클릭으로 음성 입력 시작/중지 (orb 와 동일 동작)
  if (vrmWrap) {
    vrmWrap.addEventListener("click", onOrbTap);
    vrmWrap.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); onOrbTap(); }
    });
  }

  sendBtn.addEventListener("click", () => sendMessage(inputEl.value));
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(100, inputEl.scrollHeight) + "px";
  });

  // 입력바 음성 버튼 → 음성 모드 진입
  voiceBtn.addEventListener("click", () => setUiMode("voice"));
  // 음성 모드 우하단 X 버튼 → 텍스트 모드 복귀
  voiceCloseBtn.addEventListener("click", () => setUiMode("text"));

  // 초기 모드: 텍스트
  setUiMode("text");
  setMode("idle", "", "");
  renderHistory();
</script>
</body>
</html>
