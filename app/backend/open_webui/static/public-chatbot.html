<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>전북도청 AI 안내원</title>
<!-- Three.js / three-vrm 의 bare specifier "three" 해소용 import map.
     GLTFLoader.js 와 three-vrm.module.js 가 내부에서 `import ... from 'three'` 하는데
     브라우저는 importmap 없이는 bare specifier 를 못 푼다. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --primary: #111111;
    --primary-dark: #000000;
    --bg: #ffffff;
    --surface: #ffffff;
    --text: #111111;
    --muted: #888888;
    --border: #e8e8e8;
    --user-bubble: #111111;
    --bot-bubble: #f3f3f3;
    --source-bg: #f7f7f7;
    --orb: #111111;
    --danger: #ff3b30;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  /* AIRI 레퍼런스: 흰 바탕 위에 채도가 거의 없는 옅은 회색 십자 패턴. */
  body {
    --cross-color: rgba(226, 229, 230, 0.52);
    background-color: #ffffff;
    background-image:
      radial-gradient(circle, transparent 20%, #ffffff 20%, #ffffff 80%, transparent 80%, transparent),
      radial-gradient(circle, transparent 20%, #ffffff 20%, #ffffff 80%, transparent 80%, transparent),
      linear-gradient(var(--cross-color) 2px, transparent 2px),
      linear-gradient(90deg, var(--cross-color) 2px, #ffffff 2px);
    background-position: 0 0, 25px 25px, 0 -1px, -1px 0;
    background-size: 50px 50px, 50px 50px, 25px 25px, 25px 25px;
    background-attachment: fixed;
    border: 0;
    outline: 0;
    box-shadow: none;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 720px;
    margin: 0 auto;
    background: transparent;
    border: 0;
    outline: 0;
    box-shadow: none;
  }

  /* ── 헤더 ── 로고 좌측 정렬, 다른 버튼 없음 */
  header {
    padding: 14px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    flex-shrink: 0;
    background: #fff;          /* 로고 영역은 흰 단색 — 패턴 안 비침 */
  }
  header img { height: 22px; opacity: 0.9; }

  /* ── 음성 orb 영역 — 흑백, 큰 검은 원 ── */
  /* orb/캐릭터 모두 상단 정렬 — 로고 바로 아래에 위치해서 자막/input 이 캐릭터를 가리지 않게. */
  .voice-stage {
    flex: 1 1 auto;
    padding: 12px 16px 0 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
  }
  .orb-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    user-select: none;
  }

  /* ─────────── Visual toggle (Orb ↔ Character) ─────────── */
  .visual-toggle {
    display: inline-flex;
    gap: 4px;
    background: rgba(0, 0, 0, 0.04);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 14px;
  }
  .visual-toggle .vt-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #6b7280;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .visual-toggle .vt-btn:hover { color: #374151; }
  .visual-toggle .vt-btn.vt-active {
    background: #fff;
    color: #0b3d6e;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    font-weight: 600;
  }
  body.mode-dark .visual-toggle {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(255, 255, 255, 0.08);
  }
  body.mode-dark .visual-toggle .vt-btn.vt-active {
    background: #1f2937;
    color: #93c5fd;
  }

  /* ─────────── VRM wrap (캐릭터 모드) ─────────── */
  .vrm-wrap {
    position: relative;
    width: 280px;
    height: 360px;
    user-select: none;
    border-radius: 12px;
    overflow: hidden;
    background: transparent;   /* 챗봇 윈도우 배경이 그대로 비치도록 */
  }
  .vrm-wrap canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }
  .vrm-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #6b7280;
    text-align: center;
    pointer-events: none;
  }
  body.mode-dark .vrm-placeholder { color: #9ca3af; }
  .vrm-wrap.vrm-loaded .vrm-placeholder { display: none; }

  /* mode 토글 시 표시 분기 — 기본은 orb. body.visual-character 면 캐릭터 */
  body.visual-character .orb-wrap { display: none; }
  body:not(.visual-character) .vrm-wrap { display: none !important; }

  /* 캐릭터 모드일 때도 위쪽 정렬 — 자막/input 이 캐릭터 아래에 자연스럽게 흐르도록. */
  /* voice-stage 안 좌측 정렬 + visualToggle 만 가운데 강제. char-bubble (안내원 +
     상태/질문정리) 가 캐릭터 위에 absolute 로 떠 텍스트가 캐릭터에 가려지지 않게 함. */
  .voice-stage { position: relative !important; }
  body.visual-character .voice-stage {
    justify-content: flex-start !important;
    align-items: flex-start !important;
    gap: 10px !important;
    padding-left: 0 !important;
    padding-right: 0 !important;
    padding-top: 48px !important;   /* 토글 버튼 숨김 만큼 보전 — 캐릭터 위치 유지 */
  }
  body.visual-character .vrm-wrap {
    width: 320px !important;
    height: 480px !important;
    margin-left: 0 !important;
    margin-right: auto !important;
    margin-top: auto !important;          /* column flex 에서 위 공간 채워 자식을 바닥으로 */
    margin-bottom: 0 !important;
    align-self: flex-start !important;
    flex-shrink: 0 !important;
    display: block !important;
  }
  /* visualToggle 숨김 — 캐릭터 모드 only */
  .visual-toggle { display: none !important; }
  /* 캐릭터 모드에선 기존 voice-state/voice-hint/voice-caption 모두 숨김 — 같은
     텍스트가 char-bubble 말풍선에 표시됨 + 스크롤 늘어남 방지. */
  body.visual-character .voice-state,
  body.visual-character .voice-hint,
  body.visual-character .voice-caption {
    display: none !important;
  }
  /* char-bubble stack — vrm-wrap 안 absolute, 캐릭터 복부 (top 60%) 에 박힘.
     vrm-wrap 이 position:relative 라 그 안 absolute 가 캐릭터 div 기준 상대 위치. */
  .vrm-wrap { position: relative; }
  .char-bubble-stack {
    display: none;
    position: absolute;
    left: 12px;
    top: 70%;                        /* 복부쯤 */
    max-width: calc(100% - 24px);
    z-index: 100;
    pointer-events: none;
    flex-direction: column;
    gap: 0;
    align-items: flex-start;
  }
  body.visual-character .char-bubble-stack { display: flex; }
  /* reply 박스 — 상태 박스 위 덮어씌움. speaking 중에만 표시. */
  .char-bubble-stack-reply { display: none !important; z-index: 110; }
  body.visual-character .char-bubble-stack-reply.show { display: flex !important; }
  /* AIRI 레퍼런스: blur 없이 단일 시안색으로 붙는 캐릭터 윤곽선. */
  .vrm-wrap canvas {
    filter: drop-shadow(2.5px 0 0 rgb(226, 229, 230))
            drop-shadow(-2.5px 0 0 rgb(226, 229, 230))
            drop-shadow(0 2.5px 0 rgb(226, 229, 230))
            drop-shadow(0 -2.5px 0 rgb(226, 229, 230))
            drop-shadow(2px 2px 0 rgb(226, 229, 230))
            drop-shadow(-2px 2px 0 rgb(226, 229, 230))
            drop-shadow(2px -2px 0 rgb(226, 229, 230))
            drop-shadow(-2px -2px 0 rgb(226, 229, 230));
  }
  /* 말풍선 — AIRI 레퍼런스의 청백색 면과 또렷한 시안 텍스트. */
  .char-bubble-msg {
    display: none;
    background: #f7fdff;
    color: #72cbd1;
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    font-weight: 800;
    padding: 12px 18px 14px;
    font-size: 14px;
    line-height: 1.45;
    border-radius: 12px;                       /* 덜 둥근 모서리 */
    border: 1px solid #c8eff1;
    /* 답변 길어도 스크롤 없이 잘라서 chunk 단위로 순차 표시 */
    overflow: hidden;
    pointer-events: none;
    box-shadow: 0 5px 14px rgba(0, 0, 0, 0.18),
                0 1px 3px rgba(0, 0, 0, 0.10);
  }
  .char-bubble-msg.has-text { display: block; }
  /* 박스 안 라벨 — AIRI 레퍼런스의 이름 글씨와 동일한 선명한 시안 톤. */
  .char-bubble-name {
    display: block;
    background: none;
    color: #72cbd1;
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0;
    margin-bottom: 4px;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .char-bubble-msg-text { display: block; min-height: 1.5em; }   /* 빈 텍스트일 때도 줄 공간 유지 */
  .char-bubble-msg.has-text { display: block; }
  /* 답변 재생 중에는 상태 박스 (id=charBubbleMsg) 만 숨김 — reply 덮개 박스는 영향 X */
  body.voice-speaking #charBubbleMsg { display: none !important; }
  .orb {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a2a 0%, #111111 60%, #000000 100%);
    box-shadow: 0 10px 32px rgba(0,0,0,0.25);
    animation: orb-breathe 4s ease-in-out infinite;
    transition: transform 0.3s ease, background 0.3s ease;
    overflow: hidden;
  }
  .orb-yinyang, .orb-bars { display: none; }
  @keyframes orb-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }
  .orb-wrap.listening .orb { animation: orb-listen 1.1s ease-in-out infinite; }
  @keyframes orb-listen {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }

  /* ── thinking (응답 생성 중): yin-yang 회전 ── */
  .orb-wrap.thinking .orb {
    background: radial-gradient(circle at 50% 50%, #d8d8d8 0%, #bcbcbc 65%, #a0a0a0 100%);
    animation: yin-spin 2.6s linear infinite;
    box-shadow: 0 10px 32px rgba(0,0,0,0.18);
  }
  .orb-wrap.thinking .orb-yinyang {
    display: block;
    position: absolute;
    inset: 0;
  }
  .orb-wrap.thinking .orb-yinyang .yin,
  .orb-wrap.thinking .orb-yinyang .yang {
    position: absolute;
    width: 50%;
    height: 50%;
    border-radius: 50%;
  }
  /* 위쪽 흰 원 (살짝 오른쪽) — yin-yang 의 흰 반쪽 */
  .orb-wrap.thinking .orb-yinyang .yin {
    top: 6%;
    left: 38%;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.10);
  }
  /* 아래쪽 검은 원 (살짝 왼쪽) — yin-yang 의 검은 반쪽 */
  .orb-wrap.thinking .orb-yinyang .yang {
    bottom: 6%;
    left: 12%;
    background: #000000;
  }
  @keyframes yin-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── speaking (응답 중): 4 막대 파형 ── */
  .orb-wrap.speaking .orb {
    background: transparent;
    box-shadow: none;
    animation: none;
  }
  .orb-wrap.speaking .orb-bars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 100%;
  }
  .orb-wrap.speaking .orb-bars span {
    width: 32px;
    height: 70px;
    border-radius: 22px;
    background: #000000;
    animation: speak-bar 0.55s ease-in-out infinite;
    transform-origin: center;
  }
  .orb-wrap.speaking .orb-bars span:nth-child(1) { animation-delay: 0.00s; }
  .orb-wrap.speaking .orb-bars span:nth-child(2) { animation-delay: 0.12s; }
  .orb-wrap.speaking .orb-bars span:nth-child(3) { animation-delay: 0.24s; }
  .orb-wrap.speaking .orb-bars span:nth-child(4) { animation-delay: 0.36s; }
  @keyframes speak-bar {
    0%, 100% { height: 70px; }
    50%      { height: 130px; }
  }

  .voice-state {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    min-height: 18px;
    text-align: center;
    letter-spacing: -0.01em;
  }
  .voice-hint { display: none; }

  /* 음성 모드 비활성화 (X) 버튼 — 우하단 빨강 원 */
  .voice-close-btn {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    border: 0;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(255,59,48,0.3);
    z-index: 10;
  }
  .voice-close-btn:hover { transform: scale(1.05); }
  .voice-close-btn svg { width: 22px; height: 22px; stroke: #fff; stroke-width: 2.5; fill: none; }
  body.mode-voice .voice-close-btn { display: flex; }

  /* ── 채팅 히스토리 (orb 아래 작게) ── */
  .chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--border);
    background: #fafbfd;
    min-height: 100px;
  }
  .msg { display: flex; max-width: 92%; animation: in 0.2s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; justify-content: flex-end; }
  .msg.bot  { align-self: flex-start; }
  .bubble {
    padding: 8px 12px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .sources {
    margin-top: 4px;
    background: var(--source-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .sources .src-title { font-weight: 600; margin-bottom: 3px; color: var(--text); }
  .sources a { color: var(--text); text-decoration: underline; }
  .empty-hint {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 14px 8px;
  }

  /* ── 입력바 ── */
  .input-bar {
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: #f3f3f3;
    border-radius: 22px;
    padding: 6px 6px 6px 16px;
  }
  .input-row textarea {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 0;
    font-size: 14px;
    resize: none;
    max-height: 100px;
    min-height: 28px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  .icon-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: rgba(0,0,0,0.06); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.send {
    background: var(--primary);
    color: #fff;
  }
  .icon-btn.send:hover { background: var(--primary-dark); }
  .icon-btn.send:disabled { background: #cccccc; cursor: not-allowed; }
  .icon-btn.send svg { stroke: #fff; }

  /* 좁은 화면에서 */
  @media (max-width: 480px) {
    .orb-wrap { width: 180px; height: 180px; }
  }

  /* 텍스트 모드 = 기본: orb 영역 + 자막 숨김, 대화창/입력바 표시 */
  body.mode-text .voice-stage { display: none; }
  body.mode-text .voice-caption { display: none; }

  /* 음성 모드 = orb + 자막만, 헤더 일부와 채팅창/입력바 숨김 */
  body.mode-voice .chat { display: none; }
  body.mode-voice .input-bar { display: none; }

  /* 음성 모드 자막 (사용자 발화 + 봇 응답 1세트) */
  .voice-caption {
    width: min(560px, 92%);
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 96px;
  }
  .vc-bubble {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.45;
    max-width: 92%;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .vc-bubble.visible { opacity: 1; transform: none; }
  .vc-user {
    background: var(--user-bubble);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .vc-bot {
    background: var(--bot-bubble);
    color: var(--text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
</style>
</head>
<body class="mode-text">
<div class="app">
  <header>
    <img src="/static/jblogo.png" alt="전북특별자치도" onerror="this.style.display='none'" />
  </header>

  <div class="voice-stage">
    <!-- 표시 모드 토글 — Orb ↔ Character. localStorage(jb_voice_visual) 에 저장. -->
    <div class="visual-toggle" id="visualToggle" aria-label="시각 모드 전환">
      <button type="button" class="vt-btn vt-active" data-mode="orb" title="오브 모드">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="8"/></svg>
        오브
      </button>
      <button type="button" class="vt-btn" data-mode="character" title="캐릭터 모드">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3.5-7 7-7s7 3 7 7"/></svg>
        캐릭터
      </button>
    </div>

    <div class="orb-wrap" id="orb" role="button" aria-label="음성 입력 시작/중지" tabindex="0">
      <div class="orb">
        <!-- thinking 상태: yin-yang 회전 -->
        <div class="orb-yinyang">
          <span class="yin"></span>
          <span class="yang"></span>
        </div>
        <!-- speaking 상태: 4 막대 파형 -->
        <div class="orb-bars">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- 캐릭터 모드 — Three.js + three-vrm scene. 모델 파일 /static/character.vrm 필요. -->
    <div class="vrm-wrap" id="vrmWrap" role="button" aria-label="음성 입력 시작/중지" tabindex="0">
      <canvas id="vrmCanvas" width="280" height="360"></canvas>
      <div class="vrm-placeholder" id="vrmPlaceholder">
        <svg viewBox="0 0 24 24" width="48" height="48" style="opacity:.35">
          <circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3.5-7 7-7s7 3 7 7"/>
        </svg>
        <div style="margin-top:12px;font-size:13px;opacity:.6">캐릭터 모델 로드 중…</div>
        <div style="margin-top:4px;font-size:11px;opacity:.4">/static/character.vrm</div>
      </div>
      <!-- 안내원 + 상태/질문정리 텍스트 말풍선 — 한 박스 안 라벨 + 본문. -->
      <div class="char-bubble-stack" id="charBubbleStack">
        <div class="char-bubble-msg has-text" id="charBubbleMsg">
          <span class="char-bubble-name">오티</span>
          <span class="char-bubble-msg-text" id="charBubbleMsgText"></span>
        </div>
      </div>
      <!-- 답변 재생 중에만 위 stack 을 덮어 씌우는 복제 박스. reply 메시지 도착 시 활성. -->
      <div class="char-bubble-stack char-bubble-stack-reply" id="charBubbleStackReply">
        <div class="char-bubble-msg has-text">
          <span class="char-bubble-name">오티</span>
          <span class="char-bubble-msg-text" id="charBubbleReplyText"></span>
        </div>
      </div>
    </div>


    <div class="voice-state" id="voiceState"></div>
    <div class="voice-hint" id="voiceHint"></div>
    <div class="voice-caption" id="voiceCaption">
      <!-- user / bot 자막 bubble 비표시. phase_overlay (cleaning 결과) 만 화면에 표시 -->
      <div class="vc-bubble vc-user" id="vcUser" style="display:none"></div>
      <div class="vc-bubble vc-bot" id="vcBot" style="display:none"></div>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="empty-hint" id="emptyHint"></div>
  </div>

  <div class="input-bar">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="질문을 입력하세요"></textarea>
      <button class="icon-btn" id="voiceBtn" type="button" title="음성으로 질문" aria-label="음성 모드">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </button>
      <button class="icon-btn send" id="sendBtn" type="button" title="전송" aria-label="전송">
        <svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
      </button>
    </div>
  </div>

  <button class="voice-close-btn" id="voiceCloseBtn" type="button" title="음성 모드 종료" aria-label="음성 모드 종료">
    <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>
</div>

<script>
  const API_BASE = "/api/v1/public";
  const STORAGE_KEY = "jb_public_chat_history";

  // ─────────── DOM ───────────
  const chatEl = document.getElementById("chat");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const orbEl = document.getElementById("orb");
  const stateEl = document.getElementById("voiceState");
  const hintEl = document.getElementById("voiceHint");
  const charBubbleMsg = document.getElementById("charBubbleMsg");
  const charBubbleMsgText = document.getElementById("charBubbleMsgText");

  // reply 답변을 chunk (~60자 / 문장 단위) 로 잘라 TTS 재생 속도와 비슷하게 순차 표시.
  let _replyChunkTimer = null;
  function _splitReplyChunks(text, maxLen) {
    // 문장 단위 분리. 한 문장이 maxLen 넘으면 공백 경계로만 자름 (단어 도중 자르지 않음).
    // 쉼표/조사 시작 fragment 도 피함 — 이전 chunk 와 합침.
    const sents = text.match(/[^.!?…\n]+[.!?…]+\s?|[^.!?…\n]+$/g) || [text];
    const chunks = []; let buf = "";
    const flushBuf = () => { if (buf.trim()) chunks.push(buf.trim()); buf = ""; };
    for (const s of sents) {
      if ((buf + s).length <= maxLen) { buf += s; continue; }
      flushBuf();
      if (s.length <= maxLen) { buf = s; continue; }
      // 긴 문장 — 공백 경계로 잘라 단어 보존
      const words = s.split(/(\s+)/);   // 공백 토큰 보존
      let acc = "";
      for (const w of words) {
        if ((acc + w).length <= maxLen) acc += w;
        else {
          if (acc.trim()) chunks.push(acc.trim());
          acc = w.trimStart();
        }
      }
      if (acc.trim()) buf = acc;
    }
    flushBuf();
    // ',' '。' 같이 부적절한 시작 문자 정리 — 이전 chunk 끝에 붙임
    const cleaned = [];
    for (const c of chunks) {
      if (cleaned.length && /^[,，、)\]]/.test(c)) {
        cleaned[cleaned.length - 1] += " " + c;
      } else cleaned.push(c);
    }
    return cleaned.filter(Boolean);
  }
  function showReplyChunks(text) {
    clearTimeout(_replyChunkTimer);
    _stopTypeReply();
    const replyText = document.getElementById("charBubbleReplyText");
    const replyStack = document.getElementById("charBubbleStackReply");
    if (!replyText || !replyStack) return;
    if (!text || !text.trim()) {
      replyText.textContent = "";
      replyStack.classList.remove("show");
      return;
    }
    const chunks = _splitReplyChunks(text, 60);
    let i = 0;
    const step = () => {
      if (i >= chunks.length) return;
      replyStack.classList.add("show");
      // 한 글자씩 타이핑 애니메이션 (35ms × 길이 — 빨리 보임)
      _typeInto(replyText, chunks[i], "reply");
      // 다음 chunk 까지 대기 시간 = TTS 음성 길이 추정 (한 글자 ~130ms 한국어 평균)
      // 타이핑은 빠르게 끝나고 그 후 음성 끝까지 머무르다 다음 chunk.
      // 타이핑 시간보다 항상 김 → 타이핑 진행 중 다음 chunk 로 안 넘어감.
      const TTS_PER_CHAR_MS = 130;
      const TAIL_PAUSE_MS = 350;
      const dur = chunks[i].length * TTS_PER_CHAR_MS + TAIL_PAUSE_MS;
      i++;
      if (i < chunks.length) _replyChunkTimer = setTimeout(step, dur);
    };
    step();
  }

  // 빈 본문 상태에서 . / .. / ... 사이클 반복 (대기 인디케이터).
  let _dotsTimer = null, _dotsIdx = 0;
  function _stopDots() {
    if (_dotsTimer) { clearInterval(_dotsTimer); _dotsTimer = null; }
  }
  function _startDots() {
    _stopDots();
    _stopTypeState();
    _dotsIdx = 0;
    if (charBubbleMsgText) charBubbleMsgText.textContent = ".";
    _dotsTimer = setInterval(() => {
      _dotsIdx = (_dotsIdx + 1) % 3;
      if (charBubbleMsgText) charBubbleMsgText.textContent = ".".repeat(_dotsIdx + 1);
    }, 500);
  }

  // 한 글자씩 타이핑 애니메이션. 상태 박스 / 답변 박스 별도 timer.
  const TYPE_SPEED_MS = 35;   // 한글 약 28자/초 — 자연 타자
  let _typeTimerState = null;
  let _typeTimerReply = null;
  function _stopTypeState() {
    if (_typeTimerState) { clearInterval(_typeTimerState); _typeTimerState = null; }
  }
  function _stopTypeReply() {
    if (_typeTimerReply) { clearInterval(_typeTimerReply); _typeTimerReply = null; }
  }
  function _typeInto(el, text, slot, speed) {
    if (!el) return;
    if (slot === "state") _stopTypeState();
    else _stopTypeReply();
    el.textContent = "";
    if (!text) return;
    let i = 0;
    const handle = setInterval(() => {
      i++;
      el.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(handle);
        if (slot === "state" && _typeTimerState === handle) _typeTimerState = null;
        if (slot === "reply" && _typeTimerReply === handle) _typeTimerReply = null;
      }
    }, speed || TYPE_SPEED_MS);
    if (slot === "state") _typeTimerState = handle;
    else _typeTimerReply = handle;
  }

  // stateEl + char-bubble (캐릭터 모드 말풍선) 동시 갱신.
  // 본문 텍스트는 한 글자씩 타이핑. 빈 상태에선 . / .. / ... cycle.
  // 동일 텍스트 재호출은 skip — setMode 가 음성 모드 진입 시 두 번 호출되어
  // 타이핑이 두 바퀴 도는 문제 방지.
  let _lastSetStateText = "";
  function setStateText(text) {
    const display = (text && text.trim()) ? text : "";
    if (stateEl) stateEl.textContent = display;
    if (display === _lastSetStateText) return;
    _lastSetStateText = display;
    if (display) {
      _stopDots();
      _typeInto(charBubbleMsgText, display, "state");
    } else {
      _startDots();
    }
    if (charBubbleMsg) charBubbleMsg.classList.add("has-text");
  }
  // 페이지 로드 시 dots 시작
  if (charBubbleMsgText) _startDots();
  const emptyHint = document.getElementById("emptyHint");
  const voiceBtn = document.getElementById("voiceBtn");
  const voiceCloseBtn = document.getElementById("voiceCloseBtn");
  const vcUserEl = document.getElementById("vcUser");
  const vcBotEl = document.getElementById("vcBot");

  // ─────────── UI 모드 (text / voice) ───────────
  // 첫 진입은 텍스트 모드. 헤더 토글 버튼으로 음성 모드 진입.
  // 음성 모드에서는 chat / input bar 가 숨겨지고 orb + 자막(1세트)만 표시.
  let uiMode = "text";

  function setVoiceCaption(userText, botText) {
    // user / bot 자막 표시 비활성화 — phase_overlay (cleaning 결과) 만 화면에 노출.
    // 파라미터는 받지만 DOM 갱신은 하지 않음 (호출 사이트 보존).
    return;
  }
  function clearVoiceCaption() {
    vcUserEl.textContent = "";
    vcBotEl.textContent = "";
    vcUserEl.classList.remove("visible");
    vcBotEl.classList.remove("visible");
  }

  // ─────────── Pipecat WebSocket 음성 클라이언트 ───────────
  // 음성 모드 진입 시: WS 연결 → 마이크 PCM 16kHz 16-bit LE mono 양방향 스트리밍.
  // 백엔드 Pipecat 파이프라인이 VAD/turn-taking/STT/RAG/TTS 를 처리하고 음성을
  // 같은 WS 로 돌려보낸다. 자막은 별도 텍스트 메시지로 푸시될 때 갱신.
  // (현 단계는 raw PCM 양방향만 — 텍스트 자막 메시지는 백엔드 추가 작업 후 활성화)
  let pcWs = null;
  let pcAudioCtx = null;
  let pcMicStream = null;
  let pcMicSource = null;
  let pcProcessor = null;
  let pcPlaybackTime = 0;
  let pcPlaybackSources = [];
  let pcAcceptAudio = false;
  let pcReplyAudioChunks = 0;
  let pcDroppedAudioChunks = 0;
  let pcPausedByUser = false;
  // phase_overlay (사용자 발화 요약 잠깐 끼어들기) 잠금 — 3.5s 동안 stateEl 점유.
  let phaseOverlayUntil = 0;
  let phaseOverlayPending = null;
  let phaseOverlayTimer = null;
  // 입력: 마이크 16kHz (Cohere STT 호환). 출력: TTS endpoint 응답 24kHz (Qwen3-TTS).
  const PC_SAMPLE_RATE = 16000;
  const PC_TTS_SAMPLE_RATE = 24000;

  // (롤백) 봇 답변 중 마이크 mute 는 끼어들기 자유도를 해쳐 사용자가 비활성화 요청.
  // Pipecat 의 allow_interruptions=True 만으로 끼어들기 처리.

  function _f32ToI16LE(f32) {
    const out = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  function _enqueuePlayback(arrayBuf) {
    if (!pcAudioCtx) return;
    // 새 audio chunk 도착 → onended 의 listening 전환 grace 타이머 cancel.
    clearTimeout(_endedDebounceTimer);
    // 텍스트 모드면 backend 가 보낸 audio frame 무시 (voice → text 토글 후 잔여
    // frame 들이 들어와 재생되는 케이스 차단).
    if (typeof uiMode !== "undefined" && uiMode !== "voice") return;
    if (!pcAcceptAudio) {
      pcDroppedAudioChunks += 1;
      return;
    }
    const i16 = new Int16Array(arrayBuf);
    if (!i16.length) return;
    pcReplyAudioChunks += 1;
    // 첫 audio chunk 도착 → speaking 모드 (4-bar 파형). 단계 라벨 비움.
    if (pcReplyAudioChunks === 1 && typeof setMode === "function") {
      setMode("speaking", "", "");
    }
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    const buf = pcAudioCtx.createBuffer(1, f32.length, PC_TTS_SAMPLE_RATE);
    buf.getChannelData(0).set(f32);
    const src = pcAudioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(pcAudioCtx.destination);
    const now = pcAudioCtx.currentTime;
    if (pcPlaybackTime < now + 0.05) pcPlaybackTime = now + 0.05;
    src.start(pcPlaybackTime);
    pcPlaybackTime += buf.duration;
    pcPlaybackSources.push(src);
    src.onended = () => {
      pcPlaybackSources = pcPlaybackSources.filter(s => s !== src);
      // sentence 사이 잠깐 비는 순간에 listening 으로 즉시 전환하지 않음.
      // 600ms grace — 그 사이 새 audio 도착하면 _enqueuePlayback 이 cancel.
      // 이걸 안 하면 chunk 사이 깜빡임으로 답변 박스 사라지고 상태 박스 노출.
      if (pcPlaybackSources.length === 0 && uiMode === "voice") {
        clearTimeout(_endedDebounceTimer);
        _endedDebounceTimer = setTimeout(() => {
          if (pcPlaybackSources.length === 0 && uiMode === "voice"
              && typeof setMode === "function") {
            setMode("listening", "", "");
          }
        }, 600);
      }
    };
  }
  let _endedDebounceTimer = null;

  function _clearPipecatPlayback() {
    for (const src of pcPlaybackSources) {
      try { src.stop(); } catch (_) {}
      try { src.disconnect(); } catch (_) {}
    }
    pcPlaybackSources = [];
    pcReplyAudioChunks = 0;
    if (pcAudioCtx) pcPlaybackTime = pcAudioCtx.currentTime + 0.05;
    else pcPlaybackTime = 0;
  }

  async function startVoicePipecat() {
    if (pcWs) return; // 이미 진행 중
    pcAcceptAudio = false;
    _clearPipecatPlayback();
    if (typeof setMode === "function") setMode("listening", "", "");

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const wsUrl = `${proto}://${location.host}${API_BASE}/voice-ws`;
    try {
      pcWs = new WebSocket(wsUrl);
      pcWs.binaryType = "arraybuffer";
    } catch (e) {
      if (typeof setMode === "function") setMode("idle", "연결 오류", "잠시 후 다시 시도해 주세요");
      pcWs = null;
      return;
    }

    pcWs.addEventListener("message", (ev) => {
      if (typeof ev.data === "string") {
        // 자막용 텍스트 메시지 (백엔드가 push 하기 시작하면 채움)
        try {
          const msg = JSON.parse(ev.data);
          if (msg && msg.type === "transcription") {
            pcAcceptAudio = false;
            pcDroppedAudioChunks = 0;
            setVoiceCaption(msg.text || "", null);
            // STT 도착 시점도 안전망으로 thinking 유지 (vad stop 이 먼저 와도 OK)
            if (typeof setMode === "function") setMode("thinking", "", "");
          }
          else if (msg && msg.type === "vad") {
            if (msg.text === "start") {
              // thinking / speaking 모드에선 vad start 무시. 답변 재생 중 vad start 가
              // listening 으로 mode 바꾸면 voice-speaking class 제거 → 상태 박스가
              // 잠깐 노출되는 깜빡임 발생. speaking 도 thinking 과 동등하게 처리.
              if (mode !== "thinking" && mode !== "speaking" && typeof setMode === "function") {
                setMode("listening", "", "");
              }
            } else if (msg.text === "stop") {
              if (typeof setMode === "function") setMode("thinking", "", "");
            }
          }
          else if (msg && msg.type === "phase_label") {
            console.log("[voice] phase_label:", msg.text);
            const text = msg.text || "";
            // overlay 잠금 중이면 마지막 phase 로만 기억, 잠금 끝나면 그게 적용
            if (Date.now() < phaseOverlayUntil) {
              phaseOverlayPending = text;
            } else {
              setStateText(text);
            }
          }
          else if (msg && msg.type === "phase_overlay") {
            // 잠깐 끼어드는 라벨 (예: 발화 요약). 3.5s 동안 stateEl 점유 →
            // 그 후 마지막에 도착한 phase_label 로 자동 복귀.
            console.log("[voice] phase_overlay:", msg.text);
            setStateText(msg.text || "");
            phaseOverlayUntil = Date.now() + 3500;
            phaseOverlayPending = null;
            clearTimeout(phaseOverlayTimer);
            phaseOverlayTimer = setTimeout(() => {
              phaseOverlayUntil = 0;
              if (phaseOverlayPending !== null) {
                setStateText(phaseOverlayPending);
              }
              phaseOverlayPending = null;
            }, 3500);
          }
          else if (msg && msg.type === "reply") {
            pcAcceptAudio = true;
            pcReplyAudioChunks = 0;
            pcDroppedAudioChunks = 0;
            setVoiceCaption(null, msg.text || "");
            // 첫 chunk fallback — backend 가 caption_segment 보내면 그게 덮어씀.
            // (caption_segment 가 올 거라 showReplyChunks 의 시간 추정은 사실상 미사용)
            showReplyChunks(msg.text || "");
            // 음성 대화 기록을 텍스트 모드 chat 영역 + localStorage 에 누적.
            // vcUserEl 의 텍스트는 마지막 transcription (멀티턴 합치기 마지막 chunk)
            // 으로 그 시점 사용자 발화 비슷 — 완전 정확은 아니지만 가독성 충분.
            const lastUserText = (vcUserEl.textContent || "").trim();
            if (lastUserText) {
              appendBubble("user", lastUserText);
              history.push({ role: "user", content: lastUserText });
            }
            if (msg.text) {
              appendBubble("bot", msg.text);
              history.push({ role: "assistant", content: msg.text });
            }
            if (typeof saveHistory === "function") saveHistory();
            scrollBottom();
          }
          else if (msg && msg.type === "clear") {
            pcAcceptAudio = false;
            _clearPipecatPlayback();
            setVoiceCaption(null, "");
            if (typeof setMode === "function") setMode("listening", "", "");
          }
        } catch (_) {}
      } else if (ev.data instanceof ArrayBuffer) {
        _enqueuePlayback(ev.data);
      }
    });
    pcWs.addEventListener("close", () => {
      stopVoicePipecat();
    });
    pcWs.addEventListener("error", () => {
      if (typeof setMode === "function") setMode("idle", "연결 끊김", "음성 모드 다시 시작해 주세요");
    });

    // 마이크 캡처 — 16kHz mono
    try {
      pcAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: PC_SAMPLE_RATE });
      pcMicStream = await navigator.mediaDevices.getUserMedia({
        audio: { sampleRate: PC_SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      pcMicSource = pcAudioCtx.createMediaStreamSource(pcMicStream);
      // ScriptProcessorNode (deprecated 지만 호환성·구현 단순)
      pcProcessor = pcAudioCtx.createScriptProcessor(2048, 1, 1);
      pcProcessor.onaudioprocess = (ev) => {
        if (pcPausedByUser) return;
        if (!pcWs || pcWs.readyState !== WebSocket.OPEN) return;
        const f32 = ev.inputBuffer.getChannelData(0);
        const i16 = _f32ToI16LE(f32);
        try { pcWs.send(i16.buffer); } catch (_) {}
      };
      pcMicSource.connect(pcProcessor);
      pcProcessor.connect(pcAudioCtx.destination); // ScriptProcessor 동작 위해 destination 연결 필수
      if (typeof setMode === "function") setMode("listening", "안녕하세요. 안내원 오티입니다!", "한국어로 자연스럽게 말씀해 주세요");
    } catch (e) {
      if (typeof setMode === "function") setMode("idle", "마이크 권한 거부", "브라우저 설정에서 마이크 권한 허용 후 다시 시도");
      stopVoicePipecat();
    }
  }

  function stopVoicePipecat() {
    pcPausedByUser = false;
    if (pcProcessor) { try { pcProcessor.disconnect(); } catch (_) {} pcProcessor = null; }
    if (pcMicSource) { try { pcMicSource.disconnect(); } catch (_) {} pcMicSource = null; }
    if (pcMicStream) {
      try { pcMicStream.getTracks().forEach(t => t.stop()); } catch (_) {}
      pcMicStream = null;
    }
    if (pcAudioCtx) { try { pcAudioCtx.close(); } catch (_) {} pcAudioCtx = null; }
    _clearPipecatPlayback();
    pcAcceptAudio = false;
    if (pcWs) {
      try { pcWs.close(); } catch (_) {}
      pcWs = null;
    }
    pcPlaybackTime = 0;
  }

  function setUiMode(mode) {
    const prev = uiMode;
    uiMode = mode === "voice" ? "voice" : "text";
    document.body.classList.toggle("mode-voice", uiMode === "voice");
    document.body.classList.toggle("mode-text", uiMode === "text");
    if (uiMode === "voice") {
      clearVoiceCaption();
      // 음성 모드 진입 때마다 안녕하세요 타이핑이 재생되도록 dedup state reset.
      _lastSetStateText = "";
      if (typeof stopMicLoop === "function") stopMicLoop();
      startVoicePipecat();
      // 음성 모드 진입 시점에 캐릭터 모드면 vrm load 재트리거 — 텍스트 모드일 때
      // voice-stage 가 display:none 이라 canvas client size 0 인 채로 첫 ensureLoaded
      // 가 진행될 수 있음. 음성 모드 진입 = canvas 가 진짜 layout 잡힌 시점.
      if (typeof visualMode !== "undefined" && visualMode === "character" &&
          typeof window.vrmLoadIfNeeded === "function") {
        window.vrmLoadIfNeeded();
      }
    } else {
      // 음성 모드 → 텍스트 모드 전환: 모든 음성 활동 완전 정지
      stopVoicePipecat();
      if (typeof stopMicLoop === "function") stopMicLoop();
      if (typeof stopMediaRecorderFully === "function") stopMediaRecorderFully();
      if (typeof stopAllAudio === "function") stopAllAudio();
      if (typeof stopReply === "function") stopReply();
      if (typeof micStream !== "undefined" && micStream) {
        try { micStream.getTracks().forEach(t => t.stop()); } catch (_) {}
      }
      pausedByUser = true;
      if (typeof setMode === "function") setMode("idle", "", "");
    }
  }

  // ─────────── 상태 ───────────
  let history = [];
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) history = JSON.parse(saved);
  } catch (e) { history = []; }

  // ─────────── Visual mode toggle (Orb ↔ Character) ───────────
  // localStorage 에 저장. 기본 = orb. 캐릭터 모드는 VRM scene 로딩 (Phase B+).
  const VISUAL_KEY = "jb_voice_visual";
  let visualMode = "character";   // 항상 캐릭터 모드 — 토글 버튼 숨김
  const vrmWrap = document.getElementById("vrmWrap");

  function applyVisualMode() {
    document.body.classList.toggle("visual-character", visualMode === "character");
    const btns = document.querySelectorAll(".visual-toggle .vt-btn");
    btns.forEach(b => b.classList.toggle("vt-active", b.dataset.mode === visualMode));
    // 캐릭터 모드면 즉시 로드. vrm 어댑터는 더 이상 audio/mic 흐름과 안 부딪힘
    // (createMediaElementSource·new AudioContext 다 제거됨) — 자동 호출 안전.
    if (visualMode === "character" && typeof window.vrmLoadIfNeeded === "function") {
      window.vrmLoadIfNeeded();
    }
  }
  document.querySelectorAll(".visual-toggle .vt-btn").forEach(b => {
    b.addEventListener("click", () => {
      visualMode = b.dataset.mode;
      localStorage.setItem(VISUAL_KEY, visualMode);
      applyVisualMode();
    });
  });
  applyVisualMode();

  // VRM Adapter — Three.js + three-vrm 으로 character.vrm 로드 + 모션 제어.
  // Phase B: lazy-load Three.js / three-vrm (CDN) + idle 모션
  // Phase C: setMode 이벤트 → expression / lookAt 매핑
  // Phase D: TTS audio amplitude → mouth blendshape (lip sync)
  window.vrmAdapter = (function () {
    let vrm = null;
    let scene = null, camera = null, renderer = null;
    let lipSyncAnalyser = null, lipSyncData = null, lipSyncRAF = null, lipSyncFakeOn = false;
    let isNodding = false;   // speaking 중 고개 끄덕 cycle 활성화
    let lastBlink = 0, lastEyeMove = 0, lastHead = 0;
    const eyeTarget = { x: 0, y: 0 };
    const headSway = { x: 0, y: 0 };
    let currentMode = "idle";
    let loaded = false, loading = false, loadAttempted = false;
    let measuredHeadY = 1.35;   // VRM 로드 시 측정 — eye/lookAt target 의 Y baseline
    let mixer = null, idleAction = null;   // airi idle_loop.vrma 재생용

    async function ensureLoaded() {
      if (loaded || loading) return loaded;
      loading = true;
      console.log("[VRM] ensureLoaded() 시작 — Three.js CDN import 시도");
      try {
        // 1) Three.js + three-vrm CDN import (ES module)
        const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
        console.log("[VRM] ✓ three.module.js 로드 완료");
        const { GLTFLoader } = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js");
        console.log("[VRM] ✓ GLTFLoader 로드 완료");
        // three-vrm 3.5.3 — three-vrm-animation 과 동일 메이저 버전. 2.0.7 은 -animation 부재.
        const VRMLib = await import("https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.3/lib/three-vrm.module.js");
        console.log("[VRM] ✓ three-vrm 3.5.3 로드 완료");
        // three-vrm-animation — airi 의 idle_loop.vrma 재생용. .vrma 는 GLTF 안에 packed.
        let VRMAnimLib = null;
        try {
          VRMAnimLib = await import("https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.3/lib/three-vrm-animation.module.js");
          console.log("[VRM] ✓ three-vrm-animation 3.5.3 로드 완료, exports:", Object.keys(VRMAnimLib).slice(0,10));
        } catch (e) {
          console.warn("[VRM] three-vrm-animation 로드 실패 (idle clip 비활성):", e);
        }

        const canvas = document.getElementById("vrmCanvas");
        if (!canvas) { loading = false; return false; }

        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        // canvas attribute 디폴트는 300×150. CSS 로 잡힌 실제 size 로 박지 않으면 aspect 가
        // 어긋나 캐릭터가 옆으로 넓적해진다. clientWidth/Height (CSS px) 기준으로 항상 갱신.
        const _cw = canvas.clientWidth || 320;
        const _ch = canvas.clientHeight || 480;
        renderer.setSize(_cw, _ch, false);

        scene = new THREE.Scene();
        // speech-coach (eecczz/speech-coach) 의 stage.ts 와 동일한 카메라
        camera = new THREE.PerspectiveCamera(30, _cw / _ch, 0.1, 20);
        camera.position.set(0, 1.5, 2.4);
        camera.lookAt(0, 1.4, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dir = new THREE.DirectionalLight(0xffffff, 0.8);
        dir.position.set(1, 2, 1);
        scene.add(dir);

        // 2) VRM 로드
        const loader = new GLTFLoader();
        loader.register((parser) => new VRMLib.VRMLoaderPlugin(parser));
        // VRMA animation plugin — idle_loop.vrma 를 GLTF 안에서 VRMAnimation 으로 파싱
        if (VRMAnimLib) {
          loader.register((parser) => new VRMAnimLib.VRMAnimationLoaderPlugin(parser));
        }

        await new Promise((resolve) => {
          // ?v=20260531 — 파일 교체 후 브라우저/CDN 캐시 강제 무효화. 캐릭터를
          // 새로 교체할 때 이 토큰만 올리면 클라이언트는 강제 재다운로드.
          loader.load(
            "/static/character.vrm?v=20260604_dog3",
            (gltf) => {
              try {
                vrm = gltf.userData.vrm;
                console.log("[VRM] gltf.userData.vrm:", !!vrm, "meta:", vrm?.meta);
                try { VRMLib.VRMUtils.removeUnnecessaryVertices(gltf.scene); } catch (e) { console.warn("[VRM] removeUnnecessaryVertices skip:", e.message); }
                try { VRMLib.VRMUtils.combineSkeletons(gltf.scene); } catch (e) { console.warn("[VRM] combineSkeletons skip:", e.message); }
                // VRM 1.0 = +Z 정면 / VRM 0.x = -Z 정면. rotateVRM0 가 버전 자동 감지.
                try { VRMLib.VRMUtils.rotateVRM0(vrm); } catch (e) { console.warn("[VRM] rotateVRM0 skip:", e.message); }
                scene.add(vrm.scene);
                console.log("[VRM] vrm.scene 추가 — child count:", vrm.scene.children.length);
              // 차렷 자세 보정 — idle clip 이 LeftUpperArm 같은 bone 의 quaternion track
              // 을 안 가지면 보정값이 그대로 유지되어 모션이 fix 된 것처럼 보인다. idle 시각
              // 검증 위해 임시 비활성. (idle clip 의 첫 frame pose 가 자연스러운 자세라
              // 가정 — airi 의 idle_loop 은 보통 자연 standing pose 로 시작)
              // try { ...차렷 자세 코드... } catch ...

              // ── Scale 정규화 + 카메라 자동 보정 ──
              // UniVRM export 시 mesh scale 이 안 맞으면 torsoLen 이 19m 같이 거대해진다.
              // 표준 humanoid (torsoLen ≈ 0.45m) 비율로 vrm.scene.scale 정규화 후 카메라 잡음.
              try {
                vrm.scene.updateMatrixWorld(true);
                const headNode = vrm.humanoid?.getNormalizedBoneNode(VRMLib.VRMHumanBoneName.Head);
                const hipsNode = vrm.humanoid?.getNormalizedBoneNode(VRMLib.VRMHumanBoneName.Hips);
                if (headNode && hipsNode) {
                  const headWP0 = new THREE.Vector3();
                  const hipsWP0 = new THREE.Vector3();
                  headNode.getWorldPosition(headWP0);
                  hipsNode.getWorldPosition(hipsWP0);
                  const rawTorso = Math.max(0.001, headWP0.y - hipsWP0.y);

                  // 표준 키 ≈ 1.6m, torsoLen ≈ 0.45m. rawTorso 가 이와 다르면 scale 보정.
                  const TARGET_TORSO = 0.45;
                  const scaleK = TARGET_TORSO / rawTorso;
                  if (Math.abs(scaleK - 1) > 0.1) {
                    vrm.scene.scale.setScalar(scaleK);
                    vrm.scene.updateMatrixWorld(true);
                    console.log("[VRM] scale 정규화: rawTorso=", rawTorso.toFixed(3),
                                "→ scale ×", scaleK.toFixed(4));
                  }

                  // 정규화 후 다시 측정
                  const headWP = new THREE.Vector3();
                  const hipsWP = new THREE.Vector3();
                  headNode.getWorldPosition(headWP);
                  hipsNode.getWorldPosition(hipsWP);
                  const headY = headWP.y;
                  const hipsY = hipsWP.y;
                  const torsoLen = Math.max(0.2, headY - hipsY);

                  // hipsY 가 음수 (origin 이 머리 위인 경우) → vrm.scene.position.y 보정해 hips 를 ~0.85m 로
                  if (hipsY < 0.3) {
                    vrm.scene.position.y += (0.85 - hipsY);
                    vrm.scene.updateMatrixWorld(true);
                    hipsNode.getWorldPosition(hipsWP);
                    headNode.getWorldPosition(headWP);
                    console.log("[VRM] origin 보정: hipsY → 0.85");
                  }

                  const newHeadY = headWP.y;
                  const targetY = newHeadY - torsoLen * 0.12;
                  const camY = newHeadY + torsoLen * 0.07;
                  const camZ = Math.max(0.85, torsoLen * 2.4);    // Apollo 이전 안정값
                  const camOffsetX = headWP.x - 0.05;             // 정면 살짝 좌측 (Apollo 이전 안정값)
                  camera.up.set(0,1,0); camera.quaternion.identity(); camera.position.set(camOffsetX, camY, headWP.z + camZ);
                  camera.lookAt(headWP.x, targetY, headWP.z); camera.updateMatrixWorld();
                  measuredHeadY = newHeadY;
                  console.log("[VRM] auto-fit: headY=", newHeadY.toFixed(3),
                              "hipsY=", hipsWP.y.toFixed(3),
                              "torsoLen=", torsoLen.toFixed(3),
                              "→ cam(", camOffsetX.toFixed(3), ",", camY.toFixed(3), ",", camZ.toFixed(3), ")",
                              "lookAt(", camOffsetX.toFixed(3), ",", targetY.toFixed(3), ", 0 )");
                } else {
                  console.warn("[VRM] auto-fit skip: head/hips bone 없음 — 디폴트 카메라 유지");
                }
              } catch (autoFitErr) {
                console.warn("[VRM] auto-fit 실패 — 디폴트 카메라 유지:", autoFitErr);
              }

              // ── airi idle_loop.vrma 로드 + 재생 ──
              // VRM 1.0 spec 의 VRMAnimation 컨테이너. AnimationClip 으로 변환 후 mixer 에서 loop.
              console.log("[VRM-IDLE] start, VRMAnimLib=", !!VRMAnimLib,
                          "exports=", VRMAnimLib ? Object.keys(VRMAnimLib).slice(0,15) : "N/A");
              if (VRMAnimLib) {
                const animLoader = new GLTFLoader();
                animLoader.register((parser) => new VRMAnimLib.VRMAnimationLoaderPlugin(parser));
                animLoader.load(
                  "/static/idle_loop.vrma?v=20260601ao",
                  (animGltf) => {
                    console.log("[VRM-IDLE] gltf loaded, userData keys=",
                                Object.keys(animGltf.userData || {}),
                                "vrmAnimations len=", animGltf.userData?.vrmAnimations?.length);
                    try {
                      const vrmAnim = animGltf.userData?.vrmAnimations?.[0];
                      if (!vrmAnim) {
                        console.warn("[VRM-IDLE] vrmAnimations[0] 없음. animations array?",
                                     animGltf.animations?.length);
                        return;
                      }
                      const clip = VRMAnimLib.createVRMAnimationClip(vrmAnim, vrm);
                      // three-vrm-animation 표준 예제대로 vrm.scene 사용. mixer 가 그 안
                      // descendant 에서 name 으로 binding 찾음.
                      mixer = new THREE.AnimationMixer(vrm.scene);
                      idleAction = mixer.clipAction(clip);
                      idleAction.setLoop(THREE.LoopRepeat, Infinity);
                      idleAction.weight = 1.0;
                      idleAction.enabled = true;
                      idleAction.play();
                      idleAction.timeScale = 2.0;
                      // 결정적 진단 — track name 첫개 와 vrm.scene tree 의 bone name 비교
                      const sampleTrack = clip.tracks[0]?.name || "";
                      const sampleBoneName = sampleTrack.split(".")[0];
                      let found = null;
                      vrm.scene.traverse(n => {
                        if (!found && n.name === sampleBoneName) found = n;
                      });
                      console.log("[VRM-IDLE] sample track expects bone:", sampleBoneName,
                                  "found in vrm.scene?", !!found);
                      if (!found) {
                        // 못 찾으면 normalizedHumanBonesRoot 안에서 검색
                        const root = vrm.humanoid?.normalizedHumanBonesRoot;
                        if (root) {
                          root.traverse(n => {
                            if (!found && n.name === sampleBoneName) found = n;
                          });
                          console.log("[VRM-IDLE] retry in normalizedHumanBonesRoot, found?", !!found);
                          if (found) {
                            // vrm.scene 으로는 bind 안 됨 — mixer 를 root 로 재생성
                            mixer.stopAllAction();
                            mixer = new THREE.AnimationMixer(root);
                            idleAction = mixer.clipAction(clip);
                            idleAction.setLoop(THREE.LoopRepeat, Infinity);
                            idleAction.play();
                            idleAction.timeScale = 2.0;
                            console.log("[VRM-IDLE] mixer re-created on normalizedHumanBonesRoot");
                            // vrm.scene 에 root 가 자식으로 안 붙어 있으면 추가
                            if (root.parent !== vrm.scene) {
                              vrm.scene.add(root);
                              console.log("[VRM-IDLE] normalizedHumanBonesRoot vrm.scene 에 attach");
                            }
                          }
                        }
                      }
                      console.log("[VRM-IDLE] ✓✓ 재생 시작 duration=", clip.duration.toFixed(2),
                                  "s tracks=", clip.tracks?.length);
                      // 차렷 자세 보정은 idle 모션과 충돌 — mixer 가 매 frame 팔 rotation
                      // 을 덮어쓰지 못하면 차렷 자세가 살아남고 idle 변화가 안 보인다. 적용 후
                      // 일정 시간 차렷 보정 release (단, animation 의 디폴트 pose 가 자연스러운
                      // 자세일 거라 가정).
                    } catch (clipErr) {
                      console.error("[VRM-IDLE] clip 생성 실패:", clipErr, clipErr?.stack);
                    }
                  },
                  undefined,
                  (animErr) => {
                    console.warn("[VRM] idle_loop.vrma 로드 실패 — manual sway 만 동작:", animErr);
                  }
                );
              }

              loaded = true;
              const ph = document.getElementById("vrmPlaceholder");
              if (ph) ph.remove();   // 단순 display:none 으론 CSS 충돌 가능 — DOM 통째 제거
              const wrap = document.getElementById("vrmWrap");
              if (wrap) wrap.classList.add("vrm-loaded");
              console.log("[VRM] loaded");
              resolve();
              } catch (outerE) {
                console.error("[VRM] success-callback 안 throw — primitive 분기로 폴백:", outerE);
                loaded = false;
                resolve();   // resolve 안 하면 ensureLoaded hang. fallback 분기는 if(!loaded) 후 처리.
              }
            },
            undefined,
            (err) => {
              console.warn("[VRM] character.vrm 없음 — primitive fallback (단순 head+body):", err);
              // Fallback: speech-coach 의 stage.ts 와 동일한 단순 fallback.
              // 진짜 VRM 모델이 정상 케이스. primitive 는 진단용 placeholder.
              const group = new THREE.Group();
              const skin = new THREE.MeshStandardMaterial({ color: 0xffd8b8 });
              const suit = new THREE.MeshStandardMaterial({ color: 0x3a6ea5 });

              // 머리 + 몸통 — speech-coach stage.ts 와 동일 단순 fallback
              const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 32), skin);
              head.position.set(0, 1.5, 0);
              group.add(head);
              const body = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.6, 0.18), suit);
              body.position.set(0, 1.05, 0);
              group.add(body);
              scene.add(group);
              // primitive 용 가짜 vrm-shape — 표정/lookAt 안 됨, head 만 sway 가능
              vrm = {
                scene: group,
                update: () => {},
                expressionManager: null,
                lookAt: null,
                humanoid: {
                  getNormalizedBoneNode(name) { return name === "head" ? head : null; }
                },
                _isPrimitive: true,
              };
              loaded = true;
              const ph = document.getElementById("vrmPlaceholder");
              if (ph) ph.remove();   // 단순 display:none 으론 CSS 충돌 가능 — DOM 통째 제거
              const wrap = document.getElementById("vrmWrap");
              if (wrap) wrap.classList.add("vrm-loaded");
              console.log("[VRM] primitive fallback ready");
              resolve();
            }
          );
        });

        if (!loaded) { loading = false; return false; }

        // 3) Animation loop
        const clock = new THREE.Clock();
        function animate() {
          const dt = clock.getDelta();
          const t = performance.now();

          if (vrm) {
            // Idle blink 만 유지 — manual head sway / eye lookAt / nodding 은 airi idle
            // 모션과 중복되어 어색함. idle clip 이 Neck/Shoulder/UpperArm 흔들림을
            // 책임지고, 우리는 표정 blink 만 추가.
            if (t - lastBlink > 2000 + Math.random() * 3000) {
              if (vrm.expressionManager?.setValue) {
                vrm.expressionManager.setValue("blink", 1.0);
                setTimeout(() => vrm.expressionManager?.setValue("blink", 0.0), 130);
              }
              lastBlink = t;
            }
            // Lip sync — TTS amplitude 기반
            // amp-lipsync 비활성 — fake vowel lipsync (startSpeakingLipSync) 가 처리
            // airi idle 모션 mixer step — vrm.update 이전에 호출해야 bone 변형이 spring 에 반영됨
            if (mixer) mixer.update(dt);
            // speaking 중 고개 상하 nodding (1.2Hz sine, ±0.10 rad) — idle clip 이 Head bone 안 다루므로 충돌 없음
            if (isNodding && VRMLib && VRMLib.VRMHumanBoneName) {
              const headBone = vrm.humanoid?.getNormalizedBoneNode(VRMLib.VRMHumanBoneName.Head);
              if (headBone) {
                const phaseSec = performance.now() / 1000;
                headBone.rotation.x = Math.sin(phaseSec * 2 * Math.PI * 1.2) * 0.04;
              }
            }
            vrm.update(dt);

            // (VRM-DIAG hips quaternion 로그 비활성)
          }
          renderer.render(scene, camera);
          requestAnimationFrame(animate);
        }
        animate();

        // 컨테이너 size 변화 시 (윈도우 resize / 모드 토글) renderer + camera aspect 재조정.
        try {
          const ro = new ResizeObserver(() => {
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (w > 0 && h > 0) {
              renderer.setSize(w, h, false);
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
            }
          });
          ro.observe(canvas);

    function setExpression(name, value) {
      if (!vrm?.expressionManager?.setValue) return;
      // 표정 reset 후 한 가지만
      ["happy", "sad", "angry", "relaxed", "surprised"].forEach((e) => {
        if (e !== name) vrm.expressionManager.setValue(e, 0);
      });
      vrm.expressionManager.setValue(name, value);
    }

    // 말하는 동안 입모양 cycle — vowel (aa/ih/ou/ee/oh) 가 시간 따라 자연 전환.
    // 단순 aa 사인파 보다 입 모양이 다양하게 변해서 "말하는 느낌" 살아남.
    function startSpeakingLipSync() {
      if (!vrm) return;
      if (lipSyncFakeOn) return;
      const VOWELS = ["aa", "ih", "ou", "ee", "oh"];
      let curVowelIdx = 0;
      let prevVowelIdx = 0;
      let transitionStart = performance.now();
      let lastVowelSwitch = performance.now();
      let lastPunctuationPause = 0;
      function tick() {
        if (!lipSyncFakeOn) return;
        const now = performance.now();
        const t = now / 1000;

        // 입 벌림 — 3 sine 합성 (1.6Hz base + 3.3Hz wobble + 0.8Hz drift)
        let open = 0.10
                 + 0.32 * (0.5 + 0.5 * Math.sin(t * 2 * Math.PI * 1.6))
                 + 0.18 * (0.5 + 0.5 * Math.sin(t * 2 * Math.PI * 3.3 + 1.2))
                 + 0.10 * (0.5 + 0.5 * Math.sin(t * 2 * Math.PI * 0.8 + 0.4));
        open = Math.min(0.95, open);

        // 가끔 짧은 puncutation pause — 0.6초마다 약 15% 확률 으로 60~140ms 입 닫음
        if (now - lastPunctuationPause > 600 && Math.random() < 0.04) {
          lastPunctuationPause = now;
        }
        if (now - lastPunctuationPause < 100 + Math.random() * 40) {
          open *= 0.15;   // 거의 닫힘
        }

        // vowel 전환 — 110~240ms 마다 (자연 한국어 음절 리듬)
        if (now - lastVowelSwitch > 110 + Math.random() * 130) {
          let nextIdx;
          do { nextIdx = Math.floor(Math.random() * VOWELS.length); } while (nextIdx === curVowelIdx);
          prevVowelIdx = curVowelIdx;
          curVowelIdx = nextIdx;
          transitionStart = now;
          lastVowelSwitch = now;
        }

        // 두 vowel cross-fade (75ms) — 형태 다이내믹 + 갑작스러운 전환 방지
        const fade = Math.min(1, (now - transitionStart) / 75);
        if (vrm.expressionManager?.setValue) {
          for (const v of VOWELS) vrm.expressionManager.setValue(v, 0);
          vrm.expressionManager.setValue(VOWELS[curVowelIdx], open * fade);
          if (prevVowelIdx !== curVowelIdx) {
            vrm.expressionManager.setValue(VOWELS[prevVowelIdx], open * (1 - fade) * 0.7);
          }
        }
        lipSyncRAF = requestAnimationFrame(tick);
      }
      lipSyncFakeOn = true;
      tick();
    }

    function stopSpeakingLipSync() {
      lipSyncFakeOn = false;
      if (lipSyncRAF) { cancelAnimationFrame(lipSyncRAF); lipSyncRAF = null; }
      if (vrm?.expressionManager?.setValue) {
        ["aa", "ih", "ou", "ee", "oh"].forEach(v => vrm.expressionManager.setValue(v, 0));
      }
    }

    function applySvgMode(next) {
      const w = document.getElementById("vrmWrap");
      if (!w) return;
      ["svg-listening", "svg-thinking", "svg-speaking", "svg-idle"].forEach(c => w.classList.remove(c));
      w.classList.add("svg-" + (next || "idle"));

      onMode(next) {

          eyeTarget.x = 0;
          eyeTarget.y = -0.05;
          setExpression("relaxed", 0.3);

          eyeTarget.x = 0;
          eyeTarget.y = 0;
          setExpression("happy", 0.4);
          startSpeakingLipSync();

  function appendBubble(role, content, sources) {
    clearEmptyHint();

      // metadata 는 chunk 별 리스트. URL 단위 dedup 후 최대 5개 표시.
      const seen = new Set();
      let shown = 0;
      sources.forEach(s => {
        const metas = Array.isArray(s.metadata) ? s.metadata : (s.metadata ? [s.metadata] : []);
        for (const m of metas) {
          if (shown >= 5) break;
          if (!m || typeof m !== "object") continue;
          const url = m.url || m.source || "";
          const dedupKey = url || (m.title || m.name || "");
          if (!dedupKey || seen.has(dedupKey)) continue;
          seen.add(dedupKey);
          shown++;
          const name = m.title || m.name || m.institution || (s.source && s.source.name) || "출처";

            (url ? ` · <a href="${escapeHtml(String(url))}" target="_blank" rel="noopener">바로가기</a>` : "");
          box.appendChild(row);
        }
      });
      if (shown > 0) msg.appendChild(box);
    }

    scrollBottom();

  function escapeHtml(s) {

    // audio_url 이 없으면 무음으로 텍스트만 표시.
    // 안전망: 텍스트 모드 (uiMode !== "voice") 에서는 어떤 경로로 호출되든 재생 안 함.
    if (typeof uiMode !== "undefined" && uiMode !== "voice") {
      stopAllAudio();

    stopMediaRecorderFully();

    const onEnd = () => {

    onEnd();

  // ─────────── 음성 자동 모드 (continuous listening + VAD + PCM pre-roll) ───────────
  // 발화 시작 클리핑 방지: MediaRecorder/webm 대신 ScriptProcessorNode 로
  // raw Float32 PCM 샘플을 ring buffer 에 항상 적재. VAD 트리거 시 ring 의
  // 600ms pre-roll + 이후 모든 샘플을 합쳐서 WAV 인코딩 후 STT 에 전송.
  // WAV 헤더는 매 utterance 마다 새로 생성되므로 webm 같은 손상 위험 없음.
  let micStream = null;
  let micAudioCtx = null;
  let micAnalyser = null;
  let micBuf = null;
  let micRafId = 0;
  let pausedByUser = true;
  let speechStartedAt = 0;
  let recStartedAt = 0;
  let recLastSpeechAt = 0;

  let pcmScriptNode = null;
  let pcmSampleRate = 48000;
  let pcmRingBuffer = [];                 // [Float32Array, ...] — listening 중 ring
  let pcmRingTotalSamples = 0;
  let isCapturingSpeech = false;          // true 면 ring 안 자르고 발화 캡처
  const PREROLL_SECONDS = 0.6;            // 발화 시작 600ms 전 음성도 보존
  const PCM_BUFFER_SIZE = 4096;           // ScriptProcessor frame size

  const VAD_SPEECH_RMS = 0.020;
  const SPEECH_HOLD_MS = 100;
  const SILENCE_TAIL_MS = 900;
  const MAX_RECORD_MS = 15000;
  const DEBUG_VAD = true;

  // ─────────── PCM → WAV 인코딩 (16-bit mono) ───────────
  function _writeStr(view, off, s) {
    for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
  }
  function encodePcmToWav(float32Chunks, sampleRate) {
    let total = 0;
    for (const c of float32Chunks) total += c.length;
    const buffer = new ArrayBuffer(44 + total * 2);
    const view = new DataView(buffer);
    _writeStr(view, 0, "RIFF");
    view.setUint32(4, 36 + total * 2, true);
    _writeStr(view, 8, "WAVE");
    _writeStr(view, 12, "fmt ");
    view.setUint32(16, 16, true);                   // fmt chunk size
    view.setUint16(20, 1, true);                    // PCM format
    view.setUint16(22, 1, true);                    // mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);       // byte rate
    view.setUint16(32, 2, true);                    // block align
    view.setUint16(34, 16, true);                   // bits per sample
    _writeStr(view, 36, "data");
    view.setUint32(40, total * 2, true);
    let off = 44;
    for (const c of float32Chunks) {
      for (let i = 0; i < c.length; i++, off += 2) {
        const s = Math.max(-1, Math.min(1, c[i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
    }
    return new Blob([buffer], { type: "audio/wav" });
  }

  async function ensureMic() {
    if (micStream) return true;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        }
      });
      micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      try { if (micAudioCtx.state === "suspended") await micAudioCtx.resume(); } catch (_) {}
      pcmSampleRate = micAudioCtx.sampleRate || 48000;

      const src = micAudioCtx.createMediaStreamSource(micStream);
      micAnalyser = micAudioCtx.createAnalyser();
      micAnalyser.fftSize = 1024;
      micAnalyser.smoothingTimeConstant = 0.3;
      micBuf = new Float32Array(micAnalyser.fftSize);
      src.connect(micAnalyser);

      // PCM 캡처 ScriptProcessorNode — listening 동안 항상 ring buffer 적재
      pcmScriptNode = micAudioCtx.createScriptProcessor(PCM_BUFFER_SIZE, 1, 1);
      pcmScriptNode.onaudioprocess = (e) => {
        if (pausedByUser) return;
        // 다른 모드 (speaking/thinking) 에선 캡처 안 함
        if (mode !== "listening" && mode !== "recording") return;

        const inputData = e.inputBuffer.getChannelData(0);
        // copy (ScriptProcessor 는 buffer reuse 함)
        const copy = new Float32Array(inputData);
        pcmRingBuffer.push(copy);
        pcmRingTotalSamples += copy.length;

        // listening 중엔 ring 을 PREROLL_SECONDS 만큼만 유지 (오래된 샘플 drop)
        // recording 중엔 안 자름 (모두 보존)
        if (!isCapturingSpeech) {
          const ringMaxSamples = Math.floor(pcmSampleRate * PREROLL_SECONDS);
          while (pcmRingTotalSamples - pcmRingBuffer[0].length >= ringMaxSamples) {
            pcmRingTotalSamples -= pcmRingBuffer.shift().length;
          }
        }
      };
      src.connect(pcmScriptNode);
      pcmScriptNode.connect(micAudioCtx.destination);  // ScriptProcessor 는 destination 연결 필요
      console.log(`[VAD] mic ready, sampleRate=${pcmSampleRate}`);
      return true;
    } catch (e) {
      setMode("idle", "마이크 권한이 필요해요", "Orb 를 탭하여 권한을 허용해 주세요");
      return false;
    }
  }

  function getRMS() {
    micAnalyser.getFloatTimeDomainData(micBuf);
    let sum = 0;
    for (let i = 0; i < micBuf.length; i++) sum += micBuf[i] * micBuf[i];
    return Math.sqrt(sum / micBuf.length);
  }

  let _vadDebugLastLog = 0;
  function micTick() {
    micRafId = 0;
    if (pausedByUser || !micAnalyser) return;

    const now = Date.now();
    const rms = getRMS();
    const isSpeech = rms >= VAD_SPEECH_RMS;

    if (DEBUG_VAD && now - _vadDebugLastLog > 250) {
      _vadDebugLastLog = now;
      console.log(`[VAD] mode=${mode} rms=${rms.toFixed(4)} thr=${VAD_SPEECH_RMS} isSpeech=${isSpeech}`);
    }

    if (mode === "listening") {
      if (isSpeech) {
        if (!speechStartedAt) speechStartedAt = now;
        if (now - speechStartedAt >= SPEECH_HOLD_MS) {
          startRecording();
        }
      } else {
        speechStartedAt = 0;
      }
    } else if (mode === "recording") {
      if (isSpeech) recLastSpeechAt = now;
      const silenceTail = recLastSpeechAt ? (now - recLastSpeechAt) : 0;
      if (recLastSpeechAt && silenceTail >= SILENCE_TAIL_MS) {
        stopRecording();
      } else if (now - recStartedAt > MAX_RECORD_MS) {
        stopRecording();
      }
    }

    if (!pausedByUser) micRafId = requestAnimationFrame(micTick);
  }

  function startMicLoop() {
    if (micRafId || pausedByUser) return;
    // PipeCat WebSocket (voice-ws) 이 활성이면 별도 mic loop / voice-chat
    // POST 흐름 시작하지 않는다. 두 음성 path 동시 동작 → backend 부하 + 502.
    if (typeof pcWs !== "undefined" && pcWs) return;
    speechStartedAt = 0;
    micRafId = requestAnimationFrame(micTick);
  }
  function stopMicLoop() {
    if (micRafId) cancelAnimationFrame(micRafId);
    micRafId = 0;
  }
  function stopMediaRecorderFully() {
    // PCM 캡처 중단 + ring buffer 비움
    isCapturingSpeech = false;
    pcmRingBuffer = [];
    pcmRingTotalSamples = 0;
  }

  function startRecording() {
    if (isCapturingSpeech) return;
    // ring buffer 에 이미 600ms pre-roll 들어가 있는 상태
    isCapturingSpeech = true;
    recStartedAt = Date.now();
    recLastSpeechAt = recStartedAt;
    setMode("recording", "안녕하세요. 안내원 오티입니다!", "잠시 멈추면 자동 전송돼요");
  }
  function stopRecording() {
    if (!isCapturingSpeech) return;
    isCapturingSpeech = false;

    // 모든 PCM 샘플을 WAV 로 인코딩 (pre-roll 600ms + 발화)
    const totalSamples = pcmRingTotalSamples;
    const minSamples = Math.floor(pcmSampleRate * 0.5);  // 0.5초 미만이면 무시
    if (totalSamples < minSamples) {
      pcmRingBuffer = [];
      pcmRingTotalSamples = 0;
      setMode("listening", "안녕하세요. 안내원 오티입니다!", "조금 더 길게 말씀해 주세요");
      startMicLoop();
      return;
    }
    const wavBlob = encodePcmToWav(pcmRingBuffer, pcmSampleRate);
    pcmRingBuffer = [];
    pcmRingTotalSamples = 0;
    if (DEBUG_VAD) {
      console.log(`[VAD] WAV 생성 — ${(wavBlob.size/1024).toFixed(1)}KB, samples=${totalSamples}, ${(totalSamples/pcmSampleRate).toFixed(2)}s`);
    }
    setMode("thinking", "생각 중...", "");
    submitVoice(wavBlob);
  }

  async function submitVoice(blob) {
    // 안전망 1: 텍스트 모드면 /voice-chat 호출 자체를 막음.
    if (typeof uiMode !== "undefined" && uiMode !== "voice") {
      stopMicLoop();
      stopMediaRecorderFully();
      return;
    }
    // 안전망 2: PipeCat WebSocket (voice-ws) 이 살아 있으면 /voice-chat
    // POST 흐름을 절대 호출 안 함. 두 흐름 동시 동작 시 backend 부하 +
    // /voice-chat 응답 지연으로 nginx 502 발생 (외부 노이즈 연쇄 발화 케이스).
    if (typeof pcWs !== "undefined" && pcWs) {
      stopMicLoop();
      stopMediaRecorderFully();
      return;
    }
    sendBtn.disabled = true;
    try {
      const form = new FormData();
      // WAV 우선, fallback 으로 webm — blob.type 으로 분기
      const ext = blob.type.includes("wav") ? "wav" : "webm";
      form.append("file", blob, `voice.${ext}`);
      form.append("history_json", JSON.stringify(history));
      if (lastBotEndTime > 0) {
        form.append("seconds_since_bot", String((Date.now() - lastBotEndTime) / 1000));
      }
      const resp = await fetch(`${API_BASE}/voice-chat`, { method: "POST", body: form });
      if (!resp.ok) throw new Error(await resp.text() || `HTTP ${resp.status}`);
      const data = await resp.json();
      if (data.ignored) {
        setMode("listening", "안녕하세요. 안내원 오티입니다!", "주변 소음으로 들렸어요. 다시 말씀해 주세요");
        startMicLoop();
        return;
      }
      if (data.needs_retry) {
        setMode("listening", "안녕하세요. 안내원 오티입니다!", data.reply || "한국어로 다시 말씀해 주세요");
        startMicLoop();
        return;
      }
      const question = data.question || "(음성 인식 실패)";
      const reply = data.reply || "(응답이 비어 있습니다)";
      const sources = data.sources || [];

      appendBubble("user", question);
      history.push({ role: "user", content: question });
      appendBubble("bot", reply, sources);
      history.push({ role: "assistant", content: reply, sources });
      saveHistory();

      // 음성 모드: 1세트만 자막으로 표시 (직전 세트 덮어씀)
      if (uiMode === "voice") setVoiceCaption(question, reply);

      playReply(data.audio_url || null, reply);
    } catch (e) {
      appendBubble("bot", `음성 처리 오류: ${e.message}`);
      if (uiMode === "voice") setVoiceCaption(null, `음성 처리 오류: ${e.message}`);
      enterCooldownThenListen();
    } finally {
      sendBtn.disabled = false;
    }
  }

  // 봇 응답 (TTS) 끝난 후 cool-down 후 자동 listening 재개
  function enterCooldownThenListen() {
    setMode("idle", "잠시만요", "곧 다시 들을게요");
    setTimeout(() => {
      if (pausedByUser) {
        setMode("idle", "일시정지", "Orb 를 탭하여 다시 시작");
        return;
      }
      setMode("listening", "안녕하세요. 안내원 오티입니다!", "한국어로 자연스럽게 말씀해 주세요");
      startMicLoop();
    }, COOLDOWN_AFTER_TTS_MS);
  }

  // ─────────── Orb 탭: 일시정지 비활성 — idle 에서 자동 시작/재개 만 ───────────
  async function onOrbTap() {
    // 텍스트 모드면 Orb 탭으로 음성 listening 시작 안 함.
    if (typeof uiMode !== "undefined" && uiMode !== "voice") {
      return;
    }
    // speaking / thinking / listening 중에 탭은 무시 — 일시정지 비활성.
    if (mode === "speaking" || mode === "thinking" || mode === "listening") {
      return;
    }
    if (mode === "recording") {
      // 사용자가 명시적으로 즉시 전송
      stopRecording();
      return;
    }
    if (pausedByUser || mode === "idle") {
      // 자동 모드 시작/재개
      if (!await ensureMic()) return;
      pausedByUser = false;
      setMode("listening", "안녕하세요. 안내원 오티입니다!", "한국어로 자연스럽게 말씀해 주세요");
      startMicLoop();
    }
  }

  orbEl.addEventListener("click", onOrbTap);
  orbEl.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); onOrbTap(); }
  });
  // 캐릭터 모드도 클릭으로 음성 입력 시작/중지 (orb 와 동일 동작)
  if (vrmWrap) {
    vrmWrap.addEventListener("click", onOrbTap);
    vrmWrap.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); onOrbTap(); }
    });
  }

  sendBtn.addEventListener("click", () => sendMessage(inputEl.value));
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(100, inputEl.scrollHeight) + "px";
  });

  // 입력바 음성 버튼 → 음성 모드 진입
  voiceBtn.addEventListener("click", () => setUiMode("voice"));
  // 음성 모드 우하단 X 버튼 → 텍스트 모드 복귀
  voiceCloseBtn.addEventListener("click", () => setUiMode("text"));

  // 초기 모드: 텍스트
  setUiMode("text");
  setMode("idle", "", "");
  renderHistory();
</script>
</body>
</html>
